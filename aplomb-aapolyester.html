<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aplomb — AA Polyester</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --primary:#3b82f6;
  --primary-l1:#2563eb;
  --primary-l2:#60a5fa;
  --accent:#22c55e;
  --accent-l1:#22c55e;
  --bg:#0b0e14;
  --sidebar:#0d1017;
  --card:#131722;
  --card-hover:#171c29;
  --text:#f2f4f8;
  --muted:#8b93a7;
  --border:#232838;
  --danger:#ef4444;
  --danger-bg:rgba(239,68,68,0.13);
  --warn:#eab308;
  --warn-bg:rgba(234,179,8,0.13);
  --ok:#22c55e;
  --ok-bg:rgba(34,197,94,0.13);
  --info:#8b93a7;
  --info-bg:rgba(139,147,167,0.15);
  --radius:12px;
  --shadow:0 1px 3px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Space Grotesk',sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.font-title{font-family:'Space Grotesk',sans-serif;font-weight:700;}
a{color:inherit;}
button{font-family:'Space Grotesk',sans-serif;cursor:pointer;}
::selection{background:var(--primary);color:#fff;}
svg.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px;}

.app-shell{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:240px;flex:none;background:var(--sidebar);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:60;
  transform:translateX(-100%);transition:transform 0.2s ease;
}
.sidebar.open{transform:translateX(0);}
@media(min-width:900px){ .sidebar{transform:translateX(0);} }
.sidebar .brand-row{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--border);}
.sidebar .logo{
  width:34px;height:34px;border-radius:8px;background:var(--primary);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex:none;
}
.sidebar .brand{display:flex;flex-direction:column;line-height:1.2;min-width:0;}
.sidebar .brand b{font-size:15px;}
.sidebar .brand span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--muted);
  font-size:13.5px;font-weight:500;margin-bottom:2px;border:none;background:transparent;width:100%;text-align:left;
}
.nav-item svg{width:17px;height:17px;}
.nav-item.active{background:rgba(59,130,246,0.14);color:var(--primary-l2);font-weight:700;}
.sidebar-foot{padding:12px;border-top:1px solid var(--border);}
.sidebar-foot button{
  width:100%;background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:9px;font-size:12px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}

/* Mobile topbar */
.mobile-topbar{
  display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--sidebar);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:40;
}
@media(min-width:900px){ .mobile-topbar{display:none;} }
.mobile-topbar .hamburger{background:none;border:1px solid var(--border);border-radius:8px;width:36px;height:36px;color:var(--text);display:flex;align-items:center;justify-content:center;}
.mobile-topbar .logo{width:30px;height:30px;border-radius:7px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;}
.mobile-topbar b{font-size:14px;}

.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:55;display:none;}
.sidebar-backdrop.show{display:block;}

.content{flex:1;min-width:0;}
@media(min-width:900px){ .content{margin-left:240px;} }

main#view{
  max-width:1240px;
  margin:0 auto;
  padding:16px 14px 60px;
}
@media(min-width:900px){
  main#view{padding:26px 30px 60px;}
}

/* Layout helpers */
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr;}
.grid-3{grid-template-columns:1fr;}
.grid-4{grid-template-columns:repeat(2,1fr);}
@media(min-width:640px){
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
}

.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:16px;
  border:1px solid var(--border);
}
.card h3{margin:0 0 10px;font-size:15px;}
.card + .card{margin-top:0;}

.section-title{
  display:flex;align-items:center;justify-content:space-between;
  margin:26px 0 12px;
  gap:8px;flex-wrap:wrap;
}
.section-title h2{margin:0;font-size:22px;color:var(--text);font-weight:700;}
.section-title .sub{color:var(--muted);font-size:12.5px;}
.page-head{margin-bottom:20px;}
.page-head h2{margin:0 0 4px;font-size:26px;}
.page-head .sub{color:var(--muted);font-size:13px;}

.kpi{
  background:var(--card);
  color:var(--text);
  border-radius:var(--radius);
  padding:18px;
  position:relative;
  overflow:hidden;
  border:1px solid var(--border);
}
.kpi small{opacity:0.7;font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);}
.kpi .val{font-size:26px;font-weight:700;margin-top:6px;}
.kpi .delta{font-size:11.5px;margin-top:6px;color:var(--muted);}
.kpi .icon-badge{
  position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
}
.kpi .icon-badge svg{width:18px;height:18px;}
.icon-badge.c-blue{background:rgba(59,130,246,0.16);color:#60a5fa;}
.icon-badge.c-green{background:rgba(34,197,94,0.16);color:#4ade80;}
.icon-badge.c-yellow{background:rgba(234,179,8,0.16);color:#facc15;}
.icon-badge.c-red{background:rgba(239,68,68,0.16);color:#f87171;}
.kpi.danger .val{color:#f87171;}

.btn{
  border:1px solid var(--primary);border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:600;
  background:var(--primary);color:#fff;display:inline-flex;align-items:center;gap:6px;
}
.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
.btn.accent{background:var(--accent);color:#0b1710;border-color:var(--accent);}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn.small{padding:6px 10px;font-size:12px;border-radius:7px;}
.btn:disabled{opacity:0.4;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.icon-btn{
  width:32px;height:32px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;flex:none;
}
.icon-btn:hover{color:var(--text);}
.icon-btn.danger:hover{color:#f87171;border-color:#f87171;}

.badge{
  display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:700;
  letter-spacing:0.2px;
}
.badge.brouillon{background:var(--info-bg);color:var(--muted);}
.badge.envoye{background:var(--warn-bg);color:#facc15;}
.badge.accepte{background:var(--ok-bg);color:#4ade80;}
.badge.refuse{background:var(--danger-bg);color:#f87171;}
.badge.payee{background:var(--ok-bg);color:#4ade80;}
.badge.impayee{background:var(--danger-bg);color:#f87171;}
.badge.info{background:var(--info-bg);color:var(--muted);}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);
  padding:6px 8px;border-bottom:1px solid var(--border);
}
td{padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}
.list-card{padding:0;overflow:hidden;}
.list-card table{margin:0;}

.searchbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.searchbar .search-input{flex:1;min-width:200px;position:relative;}
.searchbar .search-input svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px;}
.searchbar .search-input input{padding-left:36px;}
.searchbar select{width:auto;min-width:150px;}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.chip{
  border:1px solid var(--border);background:var(--card);border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--muted);
}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}

input,select,textarea{
  width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);
  font-family:'Space Grotesk',sans-serif;font-size:13.5px;background:var(--bg);color:var(--text);
}
input::placeholder,textarea::placeholder{color:var(--muted);}
label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin:10px 0 4px;}
label:first-child{margin-top:0;}
.form-row{display:grid;grid-template-columns:1fr;gap:0;}
.form-row.cols-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-row.cols-3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.65);
  display:flex;align-items:flex-end;justify-content:center;z-index:200;
}
@media(min-width:720px){.modal-overlay{align-items:center;}}
.modal-overlay.hidden{display:none;}
.modal-box{
  background:var(--card);border-radius:14px 14px 0 0;max-width:640px;width:100%;max-height:92vh;overflow-y:auto;
  padding:20px;position:relative;border:1px solid var(--border);
}
@media(min-width:720px){.modal-box{border-radius:14px;}}
.modal-close{
  position:sticky;top:0;float:right;background:var(--bg);border:1px solid var(--border);border-radius:50%;
  width:30px;height:30px;font-size:15px;color:var(--muted);margin-left:8px;
}
.modal-title{font-size:17px;margin:0 0 14px;color:var(--text);padding-right:36px;}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:9px;font-size:13px;
  z-index:300;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.4);
}
.toast.hidden{display:none;}

.timeline{list-style:none;margin:0;padding:0;}
.timeline li{
  display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--border);
}
.timeline li:last-child{border-bottom:none;}
.tl-dot{
  width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;margin-top:1px;
}
.tl-dot.done{background:var(--ok);color:#08210f;}
.tl-dot.next{background:var(--warn);color:#241b02;}
.tl-dot.future{background:var(--bg);color:var(--muted);border:1.5px dashed var(--border);}
.msg-box{
  background:var(--bg);border-radius:8px;padding:10px 12px;font-size:12.5px;margin-top:6px;color:var(--text);
  border-left:3px solid var(--primary);
}
.msg-box b{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}

.progress-track{background:var(--border);border-radius:999px;height:8px;overflow:hidden;}
.progress-fill{background:var(--primary);height:100%;border-radius:999px;}

.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
.kanban-col{
  flex:1;min-width:240px;background:var(--card);border-radius:10px;padding:8px;border:1px solid var(--border);
}
.kanban-col h4{font-size:11.5px;margin:2px 6px 8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;}
.kanban-card{
  background:var(--bg);border-radius:8px;padding:10px;margin-bottom:8px;font-size:12.5px;
  border:1px solid var(--border);border-left:3px solid var(--primary);
}
.kanban-card b{display:block;font-size:13px;margin-bottom:2px;}

.photo-compare{position:relative;width:100%;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:#1c2130;border:1px solid var(--border);}
.photo-compare img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;user-select:none;pointer-events:none;}
.photo-compare .after-wrap{position:absolute;top:0;left:0;height:100%;overflow:hidden;width:50%;}
.photo-compare .after-wrap img{width:var(--pc-w,100%);max-width:none;height:100%;}
.photo-compare input[type=range]{
  position:absolute;bottom:8px;left:8px;right:8px;width:calc(100% - 16px);accent-color:var(--primary);
}
.photo-compare .tag{
  position:absolute;top:8px;background:rgba(0,0,0,0.6);color:#fff;font-size:10.5px;padding:2px 8px;border-radius:999px;
}
.photo-compare .tag.left{left:8px;}
.photo-compare .tag.right{right:8px;}

.chk-list{display:flex;flex-direction:column;gap:1px;}
.chk-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-radius:8px;cursor:pointer;}
.chk-row:hover{background:var(--card);}
.chk-box{
  width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);flex:none;
  display:flex;align-items:center;justify-content:center;color:transparent;
}
.chk-box svg{width:13px;height:13px;stroke:transparent;stroke-width:3;}
.chk-row.done .chk-box{background:var(--ok);border-color:var(--ok);}
.chk-row.done .chk-box svg{stroke:#fff;}
.chk-lbl{flex:1;font-size:13px;color:var(--muted);}
.chk-row.done .chk-lbl{color:var(--text);font-weight:600;}
.chk-date{font-size:11px;color:var(--muted);flex:none;}
.click-row{cursor:pointer;}
.click-row:hover{background:var(--card-hover);}
.journal-photo{margin-top:8px;max-width:100%;max-height:160px;border-radius:8px;border:1px solid var(--border);object-fit:cover;cursor:pointer;display:block;}

.photo-thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
.photo-thumb{
  flex:none;border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:7px;
  padding:6px 12px;font-size:11.5px;font-weight:600;white-space:nowrap;
}
.photo-thumb.active{border-color:var(--primary);color:var(--primary-l2);background:rgba(59,130,246,0.12);}

.empty-note{color:var(--muted);font-size:12.5px;padding:14px 4px;}
.small{font-size:12px;color:var(--muted);}
.mt8{margin-top:8px;}
.mt16{margin-top:16px;}
.right{text-align:right;}
.center{text-align:center;}
.flex{display:flex;}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.gap6{gap:6px;}
.wrap{flex-wrap:wrap;}
.mono{font-weight:700;}
.link-btn{background:none;border:none;color:var(--primary-l2);text-decoration:underline;font-size:12.5px;font-weight:600;padding:2px;}

.item-card{
  background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:14px 16px;margin-bottom:10px;
}
.item-card.wash-green{background:rgba(34,197,94,0.07);border-color:rgba(34,197,94,0.25);}
.item-card.wash-red{background:rgba(239,68,68,0.07);border-color:rgba(239,68,68,0.25);}
.item-card.wash-yellow{background:rgba(234,179,8,0.07);border-color:rgba(234,179,8,0.25);}
.item-card .ic-row{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;margin-top:4px;}
.item-card .ic-row svg{width:14px;height:14px;}

.chart-box{position:relative;width:100%;height:150px;}
.mic-btn{
  width:64px;height:64px;border-radius:50%;background:var(--primary);border:none;color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
}
.mic-btn svg{width:26px;height:26px;}
.mic-btn.recording{background:var(--danger);animation:pulse 1.2s infinite;}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(239,68,68,0.5);}
  70%{box-shadow:0 0 0 14px rgba(239,68,68,0);}
  100%{box-shadow:0 0 0 0 rgba(239,68,68,0);}
}
.dots{letter-spacing:3px;font-size:14px;}
.dots .on{color:var(--primary-l2);}
.dots .off{color:var(--border);}

footer.app-footer{
  text-align:center;padding:26px 16px 40px;color:var(--muted);font-size:11.5px;
}
footer.app-footer button{
  background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 14px;font-size:11.5px;
}

.phone-frame{
  border:6px solid #000;border-radius:20px;max-width:340px;margin:0 auto;overflow:hidden;background:var(--card);
}
.phone-frame .pf-top{background:#000;color:#fff;padding:10px 14px;font-size:13px;font-weight:700;}
.phone-frame .pf-body{padding:12px;max-height:520px;overflow-y:auto;}

@media print{
  body{background:#fff;}
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;top:0;left:0;width:100%;padding:20px;background:#fff;color:#111;}
  .sidebar,.mobile-topbar,footer.app-footer,.modal-close,.no-print{display:none !important;}
}

/* Pool Vision AI */
.pv-tabs{display:flex;gap:6px;margin-bottom:18px;}
.pv-steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.pv-step-chip{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:7px 14px 7px 10px;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px;}
.pv-step-chip .num{width:19px;height:19px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10.5px;flex:none;}
.pv-step-chip.active{border-color:var(--primary);color:var(--text);background:rgba(59,130,246,0.1);}
.pv-step-chip.active .num{background:var(--primary);border-color:var(--primary);color:#fff;}
.pv-step-chip.done .num{background:var(--ok);border-color:var(--ok);color:#08210f;}

.pv-dropzone{
  border:2px dashed var(--border);border-radius:14px;padding:36px 18px;text-align:center;color:var(--muted);
  cursor:pointer;transition:border-color .15s;
}
.pv-dropzone:hover, .pv-dropzone.drag{border-color:var(--primary);color:var(--text);background:rgba(59,130,246,0.05);}
.pv-dropzone svg{width:30px;height:30px;margin-bottom:8px;}
.pv-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:14px;}
.pv-thumb{position:relative;border-radius:9px;overflow:hidden;aspect-ratio:1;border:2px solid var(--border);cursor:pointer;background:var(--bg);}
.pv-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.pv-thumb.main{border-color:var(--primary);}
.pv-thumb .pv-thumb-x{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.65);color:#fff;border:none;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;}
.pv-thumb .pv-thumb-tag{position:absolute;bottom:0;left:0;right:0;background:rgba(59,130,246,0.9);color:#fff;font-size:9.5px;font-weight:700;text-align:center;padding:2px 0;}

.pv-analysis-list{display:flex;flex-direction:column;gap:2px;}
.pv-analysis-row{display:flex;align-items:center;gap:10px;padding:9px 4px;font-size:13px;color:var(--muted);}
.pv-analysis-row .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;}
.pv-analysis-row .dot svg{width:12px;height:12px;stroke:transparent;stroke-width:3;}
.pv-analysis-row.done{color:var(--text);}
.pv-analysis-row.done .dot{background:var(--ok);border-color:var(--ok);}
.pv-analysis-row.done .dot svg{stroke:#fff;}
.pv-analysis-row.spin .dot{border-color:var(--primary);border-top-color:transparent;animation:pv-spin .7s linear infinite;}
@keyframes pv-spin{to{transform:rotate(360deg);}}

.pv-model-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:640px){.pv-model-grid{grid-template-columns:repeat(4,1fr);}}
.pv-model-card{border:1.5px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center;background:var(--card);}
.pv-model-card.active{border-color:var(--primary);background:rgba(59,130,246,0.08);}
.pv-model-shape{width:56px;height:36px;margin:0 auto 8px;background:var(--primary-l2);opacity:0.85;}
.pv-model-shape.rect{border-radius:5px;}
.pv-model-shape.rect-cut{clip-path:polygon(12% 0,88% 0,100% 22%,100% 100%,0 100%,0 22%);}
.pv-model-shape.oval{border-radius:50%;}
.pv-model-shape.circle{border-radius:50%;width:38px;height:38px;}
.pv-model-shape.kidney{border-radius:60% 40% 55% 45%/55% 45% 60% 40%;}
.pv-model-shape.lshape{clip-path:polygon(0 0,60% 0,60% 55%,100% 55%,100% 100%,0 100%);}
.pv-model-shape.infinity{border-radius:5px 5px 0 0;}
.pv-model-shape.lane{border-radius:18px;width:64px;height:22px;}
.pv-model-card b{display:block;font-size:12px;margin-bottom:2px;}
.pv-model-card span{font-size:10.5px;color:var(--muted);}

.color-swatch-row{display:flex;gap:8px;flex-wrap:wrap;}
.color-swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--border);flex:none;position:relative;}
.color-swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--primary);}

.pv-extra-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(min-width:640px){.pv-extra-grid{grid-template-columns:repeat(3,1fr);}}
.pv-extra-card{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);border-radius:10px;padding:10px;font-size:12.5px;font-weight:600;background:var(--card);}
.pv-extra-card.active{border-color:var(--accent);background:rgba(34,197,94,0.08);color:var(--text);}
.pv-extra-card svg{width:16px;height:16px;flex:none;color:var(--muted);}
.pv-extra-card.active svg{color:var(--accent);}

.pv-stage{position:relative;width:100%;border-radius:12px;overflow:hidden;background:#1c2130;border:1px solid var(--border);user-select:none;touch-action:none;}
.pv-stage img.pv-bg{width:100%;display:block;pointer-events:none;user-select:none;}
.pv-pool-shape{
  position:absolute;border-radius:10px;cursor:move;
  background:rgba(27,163,198,0.55);border:2px solid rgba(255,255,255,0.85);
  box-shadow:0 4px 18px rgba(0,0,0,0.35);
}
.pv-pool-shape.shape-circle,.pv-pool-shape.shape-oval,.pv-pool-shape.shape-kidney,.pv-pool-shape.shape-infinity{border-radius:50%;}
.pv-resize-handle{
  position:absolute;right:-7px;bottom:-7px;width:16px;height:16px;border-radius:50%;
  background:#fff;border:2px solid var(--primary);cursor:nwse-resize;
}
.pv-rotate-handle{
  position:absolute;left:50%;top:-26px;width:14px;height:14px;border-radius:50%;
  background:#fff;border:2px solid var(--primary);cursor:grab;transform:translateX(-50%);
}

.pv-gen-list{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
.pv-gen-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
.pv-gen-row.active{color:var(--text);font-weight:600;}
.pv-gen-row.done{color:var(--ok);}
.pv-gen-row .dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex:none;}
.pv-gen-row.active .dot{background:var(--primary);animation:pv-pulse 1s infinite;}
.pv-gen-row.done .dot{background:var(--ok);}
@keyframes pv-pulse{0%{box-shadow:0 0 0 0 rgba(59,130,246,0.5);}70%{box-shadow:0 0 0 7px rgba(59,130,246,0);}100%{box-shadow:0 0 0 0 rgba(59,130,246,0);}}

.pv-hist-thumb{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:9px;border:1px solid var(--border);margin-bottom:8px;}
</style>

const TODAY = new Date();
function daysAgo(n){ const d = new Date(TODAY); d.setDate(d.getDate()-n); d.setHours(9,0,0,0); return d; }
function daysFromNow(n){ return daysAgo(-n); }
function iso(d){ return new Date(d).toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDateLong(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}); }
function fmtEUR(n){ return (Math.round(n*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €'; }
function daysBetween(a,b){ const ms = new Date(iso(b)) - new Date(iso(a)); return Math.round(ms/86400000); }
function daysSince(d){ return daysBetween(d, TODAY); }
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shade(hex, pct){
  hex = hex.replace('#','');
  const num = parseInt(hex,16);
  let r=(num>>16)&255, g=(num>>8)&255, b=num&255;
  if(pct>0){ r+=(255-r)*pct; g+=(255-g)*pct; b+=(255-b)*pct; } else { r*=(1+pct); g*=(1+pct); b*=(1+pct); }
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}

function nextOccurrence(monthIdx){

function toggleSidebar(){

function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');

/* Modal / toast */
function openModal(html){
  document.getElementById('modalBox').innerHTML = '<button class="modal-close" onclick="closeModal()">✕</button>' + html;
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.add('hidden');
  document.getElementById('modalBox').innerHTML = '';
}
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.add('hidden'), 3200);
}

function seedIfNeeded(force){
  if(force || !store.get('seeded_v1', false)){
    const seed = buildSeed();
    store.set('clients', seed.clients);
    store.set('prestations', seed.prestations);
    store.set('devis', seed.devis);
    store.set('factures', seed.factures);
    store.set('contrats', seed.contrats);
    store.set('chantiers', seed.chantiers);
    store.set('avisDemandes', seed.avisDemandes);
    store.set('avisConfig', seed.avisConfig);
    store.set('seeded_v1', true);
  }
}

function joursEcoulesDevis(d){
  if(d.relanceSimOffset!=null) return d.relanceSimOffset;
  if(!d.dateEnvoi) return null;
  return daysSince(d.dateEnvoi);
}
function joursRetardFacture(f){
  if(f.relanceSimOffset!=null) return f.relanceSimOffset;
  return daysSince(f.dateEcheance);
}

function darkScales(extra){
  const base = { ticks:{color:'#8b93a7'}, grid:{color:'rgba(255,255,255,0.06)'} };
  const out = { x: Object.assign({}, base, (extra&&extra.x)||{}), y: Object.assign({}, base, (extra&&extra.y)||{}) };
  return out;
}
function computeMonthEvolution(){
  const year = TODAY.getFullYear(), month = TODAY.getMonth();
  const todayDate = TODAY.getDate();
  const paidThisMonth = Data.factures().filter(f=>f.statut==='payee' && f.datePaiement && new Date(f.datePaiement).getFullYear()===year && new Date(f.datePaiement).getMonth()===month);
  const labels = [], data = [];
  let running = 0;
  for(let d=1; d<=todayDate; d++){
    running += paidThisMonth.filter(f=>new Date(f.datePaiement).getDate()===d).reduce((s,f)=>s+f.totaux.ttc,0);
    labels.push(String(d));
    data.push(running);
  }
  return {labels, data};
}

/* Devis vocal */
function normalize(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function wordBoundaryIncludes(haystack, needle){
  const re = new RegExp('(^|[^a-z0-9])'+needle.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z0-9])');
  return re.test(haystack);
}
const PRESTATION_KEYWORDS = {
  p1: ['diagnostic','vidange'],
  p2: ['osmose'],
  p3: ['poncage','preparation coque'],
  p4: ['gelcoat'],
  p5: ['fissure'],
  p6: ['liner'],
  p7: ['pompe de filtration','pompe'],
  p8: ['filtre a sable','filtre sable'],
  p9: ['margelle'],
  p10: ['hivernage','hiverner'],
  p11: ['mise en service','remise en service'],
  p12: ['contrat annuel','deux passages'],
};
let vocalRecognition = null;
let vocalRecording = false;
function openDevisVocal(){
  const supported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  openModal(`
    <h3 class="modal-title">Devis vocal</h3>
    <p class="small">Décrivez les travaux à voix haute, par exemple : « hivernage et reprise de margelles 6 mètres linéaires chez Isabelle Marty ». Aplomb reconnaît le client et les prestations.</p>
    ${supported ? `
      <div class="center mt16">
        <button class="mic-btn" id="vocalMicBtn" onclick="toggleVocalRecording()">${icon('mic')}</button>
        <div class="small mt8" id="vocalStatus">Appuyez pour parler</div>
      </div>
    ` : `<div class="small mt16">Reconnaissance vocale non disponible sur ce navigateur — dictez le texte ci-dessous à l’écrit.</div>`}
    <label class="mt16">Transcription</label>
    <textarea id="vocal-transcript" rows="4" placeholder="Ex : traitement osmose et gelcoat 30 m² pour Sophie Delcros"></textarea>
    <div class="btn-row mt16"><button class="btn" onclick="analyserDicteeVocale()">${icon('check')}Analyser et pré-remplir le devis</button><button class="btn secondary" onclick="closeModal()">Annuler</button></div>
  `);
}
function getVocalRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  const r = new SR();
  r.lang = 'fr-FR';
  r.continuous = true;
  r.interimResults = true;
  return r;
}
function toggleVocalRecording(){
  if(vocalRecording){ vocalRecognition && vocalRecognition.stop(); return; }
  vocalRecognition = getVocalRecognition();
  if(!vocalRecognition){ toast('Reconnaissance vocale non disponible sur ce navigateur.'); return; }
  const ta = document.getElementById('vocal-transcript');
  let finalTranscript = ta.value ? ta.value + ' ' : '';
  vocalRecognition.onstart = ()=>{
    vocalRecording = true;
    const btn = document.getElementById('vocalMicBtn'); if(btn) btn.classList.add('recording');
    const st = document.getElementById('vocalStatus'); if(st) st.textContent = 'Écoute en cours… parlez.';
  };
  vocalRecognition.onresult = (e)=>{
    let interim = '';
    for(let i=e.resultIndex; i<e.results.length; i++){
      const t = e.results[i][0].transcript;
      if(e.results[i].isFinal) finalTranscript += t + ' '; else interim += t;
    }
    const box = document.getElementById('vocal-transcript');
    if(box) box.value = finalTranscript + interim;
  };
  vocalRecognition.onerror = ()=>{ toast('Micro indisponible ou permission refusée — dictez le texte à l’écrit ci-dessous.'); };
  vocalRecognition.onend = ()=>{
    vocalRecording = false;
    const btn = document.getElementById('vocalMicBtn'); if(btn) btn.classList.remove('recording');
    const st = document.getElementById('vocalStatus'); if(st) st.textContent = 'Appuyez pour parler';
  };
  vocalRecognition.start();
}
function analyserDicteeVocale(){
  const raw = document.getElementById('vocal-transcript').value.trim();
  if(!raw){ toast('Dictez ou saisissez un texte avant d’analyser.'); return; }
  const norm = normalize(raw);
  const clients = Data.clients();
  let matchedClient = null;
  for(const c of clients){
    const parts = normalize(c.nom).split(/\s+/).filter(w=>w.length>2);
    if(parts.some(p=>wordBoundaryIncludes(norm, p))){ matchedClient = c; break; }
  }
  const prestations = Data.prestations();
  const lignes = [];
  Object.entries(PRESTATION_KEYWORDS).forEach(([pid, kws])=>{
    if(kws.some(k=>norm.includes(k))){
      const p = prestations.find(x=>x.id===pid);
      let qte = 1;
      if(p.unite==='m²' || p.unite==='ml'){
        const unitPattern = p.unite==='m²' ? /(\d+[.,]?\d*)\s*(m2|m²|metres? carres?)/i : /(\d+[.,]?\d*)\s*(ml|metres? lineaires?)/i;
        const m = norm.match(unitPattern);
        if(m) qte = parseFloat(m[1].replace(',','.'));
      }
      lignes.push({designation:p.designation, unite:p.unite, qte, prixUnitaire:p.prix, tva:p.tva});
    }
  });
  if(!lignes.length){ toast('Aucune prestation reconnue — essayez avec des mots-clés comme « hivernage », « gelcoat », « osmose »…'); return; }
  closeModal();
  openDevisForm(matchedClient ? matchedClient.id : null, lignes, raw);
}

function convertirDevisEnFacture(devisId){

let factureSearch = '';
let factureStatusFilter = 'tous';
let factureCategoryFilter = 'tous';
const FACTURE_CATEGORIES = ['Contrat d’entretien', 'Rénovation', 'Réparation', 'Installation', 'Autre'];
function categoriserFacture(f){
  const text = normalize(f.lignes.map(l=>l.designation).join(' '));
  if(text.includes('hivernage') || text.includes('mise en service') || text.includes('contrat annuel')) return 'Contrat d’entretien';
  if(text.includes('gelcoat') || text.includes('osmose') || text.includes('poncage')) return 'Rénovation';
  if(text.includes('liner')) return 'Installation';
  if(text.includes('fissure') || text.includes('filtre') || text.includes('pompe') || text.includes('margelle') || text.includes('diagnostic') || text.includes('vidange')) return 'Réparation';
  return 'Autre';
}
function factureCardHTML(f){
  const c = Data.client(f.clientId);
  const retard = f.statut==='impayee' ? joursRetardFacture(f) : null;
  const wash = f.statut==='payee' ? 'wash-green' : 'wash-red';
  return `<div class="item-card ${wash}">
    <div class="flex-between wrap">
      <div>
        <div class="flex wrap" style="align-items:center;gap:8px;"><b style="font-size:15px;">${f.numero}</b><span class="badge ${f.statut==='payee'?'payee':'impayee'}">${f.statut==='payee'?'Envoyée payée':'Envoyée non payée'}</span><span class="badge info">${categoriserFacture(f)}</span></div>
        <div class="small mt8">${esc(c.nom)}</div>
      </div>
      <div class="btn-row">
        ${f.statut==='impayee' ? `<button class="btn accent small" onclick="marquerPayee('${f.id}')">${icon('check')}Marquer payée</button>` : ''}
        <button class="icon-btn" onclick="previewFacturePDF('${f.id}')" title="Aperçu">${icon('eye')}</button>
        <button class="icon-btn" onclick="imprimerFacture('${f.id}')" title="Imprimer / PDF">${icon('download')}</button>
        <button class="icon-btn" onclick="dupliquerFacture('${f.id}')" title="Dupliquer">${icon('copy')}</button>
        <button class="icon-btn danger" onclick="deleteFacture('${f.id}')" title="Supprimer">${icon('x')}</button>
      </div>
    </div>
    <div class="grid grid-4 mt8">
      <div><div class="small">Montant TTC</div><div class="mono" style="font-size:18px;">${fmtEUR(f.totaux.ttc)}</div></div>
      <div><div class="small">Montant HT</div><div>${fmtEUR(f.totaux.ht)}</div></div>
      <div><div class="small">TVA</div><div>${fmtEUR(f.totaux.tva)}</div></div>
      <div><div class="small">Échéance</div><div>${fmtDate(f.dateEcheance)}${retard!=null?` <span style="color:#f87171;">(J+${retard})</span>`:''}</div></div>
    </div>
    ${f.statut==='impayee' && retard>=30 ? `<div class="btn-row mt8"><button class="btn danger small" onclick="previewMiseEnDemeure('${f.id}')">Mise en demeure</button></div>` : ''}
  </div>`;
}
function renderFactures(){
  const all = Data.factures().slice().sort((a,b)=> new Date(b.dateEmission)-new Date(a.dateEmission));
  const nonPayeeCount = all.filter(f=>f.statut==='impayee').length;
  const filtered = all.filter(f=>{
    const c = Data.client(f.clientId);
    const q = factureSearch.trim().toLowerCase();
    const matchSearch = !q || f.numero.toLowerCase().includes(q) || c.nom.toLowerCase().includes(q);
    const matchStatus = factureStatusFilter==='tous' || f.statut===factureStatusFilter;
    const matchCat = factureCategoryFilter==='tous' || categoriserFacture(f)===factureCategoryFilter;
    return matchSearch && matchStatus && matchCat;
  });

  let listHTML;
  if(!filtered.length){
    listHTML = `<div class="empty-note">Aucune facture ne correspond.</div>`;
  } else if(factureCategoryFilter==='tous'){
    const groups = {};
    filtered.forEach(f=>{ const cat = categoriserFacture(f); (groups[cat] = groups[cat]||[]).push(f); });
    listHTML = FACTURE_CATEGORIES.filter(cat=>groups[cat] && groups[cat].length).map(cat=>`
      <div class="section-title" style="margin-top:20px;"><h2 style="font-size:15px;">${cat} (${groups[cat].length})</h2></div>
      ${groups[cat].map(factureCardHTML).join('')}
    `).join('');
  } else {
    listHTML = filtered.map(factureCardHTML).join('');
  }

  return `
    <div class="page-head flex-between wrap">
      <div><h2>Factures ${nonPayeeCount ? `<span class="badge impayee" style="font-size:11px;">non payée : ${nonPayeeCount}</span>` : ''}</h2><div class="sub">Toutes vos factures, regroupées par catégorie</div></div>
      <button class="btn" onclick="openFactureForm()">${icon('plus')}Nouvelle facture</button>
    </div>
    <div class="searchbar">
      <div class="search-input">${icon('search')}<input placeholder="Rechercher une facture ou un client..." value="${esc(factureSearch)}" oninput="factureSearch=this.value;renderView()"></div>
      <select onchange="factureStatusFilter=this.value;renderView()">
        <option value="tous" ${factureStatusFilter==='tous'?'selected':''}>Tous les statuts</option>
        <option value="payee" ${factureStatusFilter==='payee'?'selected':''}>Payée</option>
        <option value="impayee" ${factureStatusFilter==='impayee'?'selected':''}>Impayée</option>
      </select>
    </div>
    <div class="filters">
      ${['tous', ...FACTURE_CATEGORIES].map(cat=>`<button class="chip ${factureCategoryFilter===cat?'active':''}" onclick="factureCategoryFilter='${cat}';renderView()">${cat==='tous'?'Toutes catégories':cat}</button>`).join('')}
    </div>
    ${listHTML}
  `;
}

  const nom = document.getElementById('nc-nom').value.trim();
  if(!nom){ toast('Le nom est obligatoire.'); return; }
  const type = document.getElementById('nc-type').value;
  const ville = document.getElementById('nc-ville').value || '—';
  const telephone = document.getElementById('nc-tel').value || '—';
  const email = document.getElementById('nc-email').value || '—';
  const piscineType = document.getElementById('nc-piscine-type').value;
  const volume = parseFloat(document.getElementById('nc-volume').value)||0;
  if(clientId){
    const all = Data.clients();

    Object.assign(c, {nom, type, ville, telephone, email});

  setTab('clients');

  const all = Data.devis();
  const numero = clientConfig.facturation.prefixeDevis + '-2026-' + String(50+all.length).padStart(3,'0');

  Data.setDevis([nd, ...all]);
  toast(`Réponse positive de ${cl.nom} — devis ${numero} pré-rempli créé automatiquement.`);

}

const PHASES = ['Diagnostic','Vidange','Préparation / ponçage','Traitement osmose','Application gelcoat','Finitions et margelles','Remise en eau','Réception'];
function chDoneCount(c){ return c.phases.filter(p=>p.reelle).length; }
function chStatut(c){ const n = chDoneCount(c); return n>=PHASES.length ? 'termine' : n>0 ? 'en_cours' : 'planifie'; }
function chNextPhase(c){ return c.phases.find(p=>!p.reelle) || null; }
let chantierSubView = 'planning';
function renderChantiers(){
  const chantiers = Data.chantiers();
  return `
    <div class="page-head flex-between wrap">
      <h2>Suivi de chantier</h2>
      <div class="btn-row">
        <button class="chip ${chantierSubView==='planning'?'active':''}" onclick="chantierSubView='planning';renderView()">Planning</button>
        <button class="chip ${chantierSubView==='liste'?'active':''}" onclick="chantierSubView='liste';renderView()">Chantiers</button>
      </div>
    </div>
    ${chantierSubView==='planning' ? renderChantierPlanning(chantiers) : renderChantierTable(chantiers)}
  `;
}
function renderChantierPlanning(chantiers){
  const actifs = chantiers.filter(c=>chStatut(c)!=='termine');
  const enRetard = chantiers.filter(c=>c.retard && chStatut(c)!=='termine');
  const termines30j = chantiers.filter(c=>chStatut(c)==='termine' && c.clos && daysSince(c.clos)<=30);
  const totalPhotos = chantiers.reduce((s,c)=>s+Object.keys(c.photos||{}).length,0);

let _chJournalPhoto = {};
function resizeImageFile(file, maxDim, cb){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w>maxDim || h>maxDim){
        if(w>=h){ h = Math.round(h*maxDim/w); w = maxDim; } else { w = Math.round(w*maxDim/h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function toggleChantierPhase(id, idx){
  const all = Data.chantiers();
  const c = all.find(x=>x.id===id);
  const ph = c.phases[idx];
  const wasComplete = c.phases.every(p=>p.reelle);
  ph.reelle = ph.reelle ? null : iso(TODAY);
  const nowComplete = c.phases.every(p=>p.reelle);
  if(nowComplete && !wasComplete){ c.retard = false; c.clos = iso(TODAY); }
  Data.setChantiers(all);
  if(nowComplete && !wasComplete){
    const cl = Data.client(c.clientId);
    const ad = {id: uid('ad'), clientId: c.clientId, chantierId: c.id, dateEnvoi: iso(daysFromNow(2)), statut:'envoyee'};

  openChantierDetail(id);

    ${pv.photos.length ? `<div class="pv-thumbs">${pv.photos.map((p,i)=>`
      <div class="pv-thumb ${i===pv.mainPhotoIdx?'main':''}" onclick="pvSetMainPhoto(${i})">
        <img src="${p.dataUrl}">
        ${i===pv.mainPhotoIdx?'<div class="pv-thumb-tag">Principale</div>':''}
        <button class="pv-thumb-x" onclick="event.stopPropagation();pvRemovePhoto(${i})">${icon('x')}</button>
      </div>`).join('')}</div>` : `<div class="empty-note">Aucune photo importée pour le moment.</div>`}
  </div>
  <div class="btn-row mt16">
    <button class="btn" ${pv.photos.length?'':'disabled'} onclick="pvGoStep(2)">Lancer l’analyse IA ${icon('wand')}</button>
  </div>`;
}
function pvHandleDrop(e){
  e.preventDefault();
  e.currentTarget.classList.remove('drag');
  pvHandleFiles(e.dataTransfer.files);
}
function pvHandleFiles(files){
  const room = 20 - pv.photos.length;
  Array.from(files).slice(0, Math.max(0,room)).forEach(file=>{
    resizeImageFile(file, 1600, dataUrl=>{
      pv.photos.push({id: uid('pvp'), dataUrl});
      renderView();
    });
  });
}
function pvSetMainPhoto(i){ pv.mainPhotoIdx = i; renderView(); }
function pvRemovePhoto(i){
  pv.photos.splice(i,1);
  if(pv.mainPhotoIdx>=pv.photos.length) pv.mainPhotoIdx = Math.max(0, pv.photos.length-1);
  renderView();
}

/* Step 2 — Analyse IA */
function pvRunAnalysis(){
  pv.analysisRunning = true; pv.analysisDone = false; pv.analysisActiveIdx = 0;
  pv.analysisItems = ANALYSIS_ITEMS.map(a=>Object.assign({}, a, {done:false}));
  clearInterval(pv._analysisTimer);
  pv._analysisTimer = setInterval(()=>{
    if(pv.analysisActiveIdx >= pv.analysisItems.length){
      clearInterval(pv._analysisTimer);
      pv.analysisRunning = false; pv.analysisDone = true;
      renderView();
      return;
    }
    pv.analysisItems[pv.analysisActiveIdx].done = true;
    pv.analysisActiveIdx++;
    renderView();
  }, 550);
}
function pvAnalysisSummary(){
  return `Terrain globalement plat avec une légère pente vers le fond du jardin. Forte luminosité naturelle en fin de journée, ombres portées vers le nord-est. Végétation dense repérée sur la limite gauche à préserver. Aucun obstacle majeur détecté dans la zone d’implantation retenue.`;
}
function pvStepAnalyse(){
  return `
  <div class="card">
    <h3>2. Analyse IA de la scène</h3>
    <div class="small">L’IA étudie la photo pour préparer une intégration réaliste de la piscine.</div>
    <div class="pv-analysis-list mt16">
      ${pv.analysisItems.map((a,i)=>`<div class="pv-analysis-row ${a.done?'done':(i===pv.analysisActiveIdx && pv.analysisRunning?'spin':'')}">
        <div class="dot">${a.done?icon('check'):''}</div>${a.label}
      </div>`).join('')}
    </div>
    ${pv.analysisDone ? `<div class="item-card wash-green mt16"><b>Analyse terminée</b><div class="small mt8">${pvAnalysisSummary()}</div></div>` : ''}
  </div>
  <div class="btn-row mt16">
    <button class="btn secondary" onclick="pvGoStep(1)">Retour</button>
    <button class="btn" ${pv.analysisDone?'':'disabled'} onclick="pvGoStep(3)">Choisir la piscine</button>
  </div>`;
}

/* Step 3 — Piscine */
function pvSelectModel(id){ pv.modelId = id; renderView(); }
function pvSetCustom(key, val){

  renderView();
}
function pvToggleExtra(id){
  const i = pv.custom.extras.indexOf(id);
  if(i>-1) pv.custom.extras.splice(i,1); else pv.custom.extras.push(id);
  renderView();
}
function pvStepPiscine(){
  const c = pv.custom;
  return `
  <div class="card">
    <h3>3. Choisissez le modèle de piscine</h3>
    <div class="pv-model-grid">
      ${POOL_MODELS.map(m=>`<div class="pv-model-card ${pv.modelId===m.id?'active':''}" onclick="pvSelectModel('${m.id}')">
        <div class="pv-model-shape ${m.shape}"></div><b>${m.nom}</b><span>${m.desc}</span>

    </div>
  </div>
  <div class="card mt16">
    <h3>Dimensions</h3>
    <div class="form-row cols-2">
      <div><label>Longueur (m)</label><input type="number" min="2" max="20" step="0.5" value="${c.longueur}" onchange="pvSetCustom('longueur', this.value)"></div>
      <div><label>Largeur (m)</label><input type="number" min="2" max="12" step="0.5" value="${c.largeur}" onchange="pvSetCustom('largeur', this.value)"></div>
    </div>
  </div>
  <div class="card mt16"><h3>Couleur de l’eau</h3>
    <div class="color-swatch-row">${EAU_COLORS.map(x=>`<button class="color-swatch ${c.eau===x.id?'active':''}" style="background:${x.hex};" title="${x.nom}" onclick="pvSetCustom('eau','${x.id}')"></button>`).join('')}</div>
  </div>
  <div class="card mt16"><h3>Liner</h3>
    <div class="color-swatch-row">${LINER_COLORS.map(x=>`<button class="color-swatch ${c.liner===x.id?'active':''}" style="background:${x.hex};" title="${x.nom}" onclick="pvSetCustom('liner','${x.id}')"></button>`).join('')}</div>
  </div>
  <div class="card mt16"><h3>Margelles</h3>
    <div class="color-swatch-row">${MARGELLE_COLORS.map(x=>`<button class="color-swatch ${c.margelle===x.id?'active':''}" style="background:${x.hex};" title="${x.nom}" onclick="pvSetCustom('margelle','${x.id}')"></button>`).join('')}</div>
  </div>
  <div class="card mt16"><h3>Terrasse / plage</h3>
    <div class="filters">${TERRASSE_OPTIONS.map(t=>`<button class="chip ${c.terrasse===t.id?'active':''}" onclick="pvSetCustom('terrasse','${t.id}')">${t.nom}</button>`).join('')}</div>
  </div>
  <div class="card mt16"><h3>Options complémentaires</h3>
    <div class="pv-extra-grid">${EXTRA_OPTIONS.map(o=>`<div class="pv-extra-card ${c.extras.includes(o.id)?'active':''}" onclick="pvToggleExtra('${o.id}')">${icon(o.icone)}${o.nom}</div>`).join('')}</div>
  </div>
  <div class="btn-row mt16">
    <button class="btn secondary" onclick="pvGoStep(2)">Retour</button>
    <button class="btn" ${pv.modelId?'':'disabled'} onclick="pvGoStep(4)">Positionner la piscine</button>
  </div>`;
}

/* Step 4 — Positionnement */
function pvShapeClass(shape){ return (shape==='oval'||shape==='circle'||shape==='kidney'||shape==='infinity') ? shape : 'rect'; }
function pvStepPosition(){
  const photo = pv.photos[pv.mainPhotoIdx];
  const model = POOL_MODELS.find(m=>m.id===pv.modelId) || POOL_MODELS[0];
  return `
  <div class="card">
    <h3>4. Positionnement de la piscine</h3>
    <div class="small">Déplacez, redimensionnez et faites pivoter la piscine pour l’aligner avec la perspective du jardin.</div>
    <div class="pv-stage mt16" id="pv-stage" onpointermove="pvPointerMove(event)" onpointerup="pvPointerUp(event)" onpointerleave="pvPointerUp(event)">
      <img class="pv-bg" src="${photo.dataUrl}">
      <div class="pv-pool-shape shape-${pvShapeClass(model.shape)}" id="pv-pool-el"
        style="left:${pv.pos.x}%;top:${pv.pos.y}%;width:${pv.pos.w}%;height:${pv.pos.h}%;transform:rotate(${pv.pos.rot}deg);"
        onpointerdown="pvPointerDown(event,'move')">
        <div class="pv-rotate-handle" onpointerdown="event.stopPropagation();pvPointerDown(event,'rotate')"></div>
        <div class="pv-resize-handle" onpointerdown="event.stopPropagation();pvPointerDown(event,'resize')"></div>
      </div>
    </div>
    <div class="btn-row mt16"><button class="btn secondary small" onclick="pvAutoAlign()">${icon('wand')}Alignement automatique</button></div>
  </div>
  <div class="btn-row mt16">
    <button class="btn secondary" onclick="pvGoStep(3)">Retour</button>
    <button class="btn accent" onclick="pvGoStep(5)">Générer le rendu IA ${icon('wand')}</button>
  </div>`;
}
function pvPointerDown(e, mode){
  e.preventDefault();
  const stage = document.getElementById('pv-stage');
  const rect = stage.getBoundingClientRect();
  pv._drag = {mode, rect, startX:e.clientX, startY:e.clientY, orig:Object.assign({}, pv.pos)};
  try{ e.target.setPointerCapture(e.pointerId); }catch(err){}
}
function pvPointerMove(e){
  if(!pv._drag) return;
  const d = pv._drag;
  const dxPct = (e.clientX - d.startX) / d.rect.width * 100;
  const dyPct = (e.clientY - d.startY) / d.rect.height * 100;
  if(d.mode==='move'){
    pv.pos.x = Math.max(0, Math.min(100-pv.pos.w, d.orig.x + dxPct));
    pv.pos.y = Math.max(0, Math.min(100-pv.pos.h, d.orig.y + dyPct));
  } else if(d.mode==='resize'){
    pv.pos.w = Math.max(8, Math.min(90, d.orig.w + dxPct));
    pv.pos.h = Math.max(8, Math.min(90, d.orig.h + dyPct));
  } else if(d.mode==='rotate'){
    pv.pos.rot = Math.max(-45, Math.min(45, d.orig.rot + dxPct));
  }
  pvUpdatePoolElStyle();
}
function pvPointerUp(){ pv._drag = null; }
function pvUpdatePoolElStyle(){
  const el = document.getElementById('pv-pool-el');
  if(!el) return;
  el.style.left = pv.pos.x+'%'; el.style.top = pv.pos.y+'%'; el.style.width = pv.pos.w+'%'; el.style.height = pv.pos.h+'%';
  el.style.transform = 'rotate('+pv.pos.rot+'deg)';
}
function pvAutoAlign(){
  pv.pos = {x:28, y:52, w:44, h:24, rot:0};
  toast('Analyse de la perspective terminée — piscine alignée automatiquement.');
  renderView();
}

/* Step 5 — Génération + Résultat */
function pvGoStep(n){
  if(n===2 && !pv.analysisDone){ pv.step=2; renderView(); pvRunAnalysis(); return; }
  if(n===5){ pv.step=5; pv.genRunning=true; pv.genStage=0; pv.resultUrl=null; renderView(); pvRunGeneration(); return; }
  pv.step = n; renderView();
}
function pvRunGeneration(){
  clearInterval(pv._genTimer);
  pv._genTimer = setInterval(()=>{
    pv.genStage++;
    if(pv.genStage >= GEN_STAGES.length){ clearInterval(pv._genTimer); pvComposite(); return; }
    renderView();
  }, 500);
}
function pvPathShape(ctx, round, x, y, w, h){
  ctx.beginPath();
  if(round){
    ctx.ellipse(x+w/2, y+h/2, Math.max(w,1)/2, Math.max(h,1)/2, 0, 0, Math.PI*2);
  } else {
    const r = Math.min(w,h)*0.06;
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
  }
  ctx.closePath();
}
function pvDrawPoolShape(ctx, shape, w, h, eauHex, margHex){
  const margin = Math.max(4, Math.min(w,h)*0.08);
  const round = pvShapeClass(shape)!=='rect';
  ctx.globalAlpha = 0.94;
  ctx.fillStyle = margHex;
  pvPathShape(ctx, round, -w/2-margin, -h/2-margin, w+margin*2, h+margin*2);
  ctx.fill();
  const grad = ctx.createLinearGradient(-w/2, -h/2, w/2, h/2);
  grad.addColorStop(0, shade(eauHex, 0.25));
  grad.addColorStop(0.5, eauHex);
  grad.addColorStop(1, shade(eauHex, -0.2));
  ctx.fillStyle = grad;
  pvPathShape(ctx, round, -w/2, -h/2, w, h);
  ctx.fill();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = '#ffffff';
  pvPathShape(ctx, round, -w/2, -h/2, w, h*0.32);
  ctx.fill();
  ctx.globalAlpha = 1;
}
function pvComposite(){
  const img = new Image();
  img.onload = ()=>{
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const model = POOL_MODELS.find(m=>m.id===pv.modelId) || POOL_MODELS[0];
    const eau = (EAU_COLORS.find(x=>x.id===pv.custom.eau)||EAU_COLORS[0]).hex;
    const marg = (MARGELLE_COLORS.find(x=>x.id===pv.custom.margelle)||MARGELLE_COLORS[0]).hex;
    const px = pv.pos.x/100*canvas.width, py = pv.pos.y/100*canvas.height;
    const pw = pv.pos.w/100*canvas.width, ph = pv.pos.h/100*canvas.height;
    ctx.save();
    ctx.translate(px+pw/2, py+ph/2);
    ctx.rotate(pv.pos.rot*Math.PI/180);
    pvDrawPoolShape(ctx, model.shape, pw, ph, eau, marg);
    ctx.restore();
    pv.resultUrl = canvas.toDataURL('image/jpeg', 0.92);
    pv.genRunning = false;
    renderView();
  };
  img.onerror = ()=>{ toast('Erreur lors de la génération du rendu.'); pv.genRunning=false; pv.step=4; renderView(); };
  img.src = pv.photos[pv.mainPhotoIdx].dataUrl;
}
function pvStepGenerating(){
  return `
  <div class="card">
    <h3>5. Génération du rendu</h3>
    <div class="small">L’IA fusionne la piscine choisie avec votre photo, en respectant la lumière et la perspective détectées.</div>
    <div class="pv-gen-list">
      ${GEN_STAGES.map((s,i)=>`<div class="pv-gen-row ${i<pv.genStage?'done':(i===pv.genStage?'active':'')}"><div class="dot"></div>${s}</div>`).join('')}
    </div>
    <div class="progress-track mt16"><div class="progress-fill" style="width:${Math.round(pv.genStage/GEN_STAGES.length*100)}%;"></div></div>
  </div>`;
}
function pvResultCompare(){
  pcCounter++;
  const cid = 'pvc'+pcCounter;
  const before = pv.photos[pv.mainPhotoIdx].dataUrl;
  return `
  <div class="photo-compare mt16" id="${cid}">
    <img src="${before}">
    <div class="after-wrap" style="width:50%;"><img src="${pv.resultUrl}" style="width:200%;"></div>
    <span class="tag left">Avant</span><span class="tag right">Après (IA)</span>
    <input type="range" min="0" max="100" value="50" oninput="updatePhotoCompare('${cid}', this.value)">
  </div>`;
}
function pvSetClient(id){ pv.clientId = id; if(id) pv.clientNom=''; }
function pvOpenAmelioration(){
  openModal(`<h3 class="modal-title">Améliorer le projet</h3>
    <div class="small mb">Suggestions IA pour valoriser ce projet, avec estimation budgétaire.</div>
    ${AMELIORATION_POOL.map(a=>`<div class="item-card"><div class="flex-between"><b>${a.label}</b><span class="badge info">${a.budget}</span></div></div>`).join('')}`);
}
function pvSaveRender(){
  if(!pv.clientId && !pv.clientNom.trim()){ toast('Sélectionnez un client ou saisissez un nom.'); return; }
  const model = POOL_MODELS.find(m=>m.id===pv.modelId);
  const rec = {
    id: uid('pv'), date: iso(TODAY), clientId: pv.clientId || null,
    clientNom: pv.clientId ? Data.client(pv.clientId).nom : pv.clientNom.trim(),
    modelNom: model ? model.nom : '', beforeUrl: pv.photos[pv.mainPhotoIdx].dataUrl, resultUrl: pv.resultUrl,
  };
  Data.setPoolRenders([rec, ...Data.poolRenders()]);
  toast('Rendu enregistré dans l’historique.');
  pv.view = 'historique';
  renderView();
}
function pvRestart(){ pv = pvInitialState(); renderView(); }
function pvStepResultat(){
  if(pv.genRunning || !pv.resultUrl) return pvStepGenerating();
  const clients = Data.clients();
  return `
  <div class="card">
    <h3>5. Résultat</h3>
    ${pvResultCompare()}
    <div class="btn-row mt16">
      <a class="btn" href="${pv.resultUrl}" download="pool-vision-render.jpg">${icon('download')}Télécharger (HD)</a>
      <button class="btn secondary" onclick="pvOpenAmelioration()">${icon('wand')}Améliorer le projet</button>
      <button class="btn ghost" onclick="pvRestart()">Nouveau photomontage</button>
    </div>
  </div>
  <div class="card mt16">
    <h3>Associer à un client</h3>
    <label>Client existant</label>
    <select onchange="pvSetClient(this.value)">
      <option value="">— Sélectionner —</option>
      ${clients.map(c=>`<option value="${c.id}" ${pv.clientId===c.id?'selected':''}>${esc(c.nom)}</option>`).join('')}
    </select>
    <label>ou nom du prospect</label>
    <input type="text" placeholder="Nom du prospect" value="${esc(pv.clientNom)}" onchange="pv.clientNom=this.value;">
    <div class="btn-row mt16"><button class="btn accent" onclick="pvSaveRender()">${icon('check')}Enregistrer le rendu</button></div>
  </div>`;
}

/* Historique */
function renderPoolVisionHistorique(){
  const list = Data.poolRenders();
  return `
    <div class="page-head"><h2>Pool Vision AI</h2><div class="sub">Historique des photomontages générés.</div></div>
    ${renderPoolVisionTabs()}
    ${list.length ? `<div class="grid grid-3">${list.map(r=>`
      <div class="card">
        <img class="pv-hist-thumb" src="${r.resultUrl}">
        <b>${esc(r.clientNom)}</b>

          <button class="btn small secondary" onclick="pvViewRender('${r.id}')">${icon('eye')}Voir</button>
          <button class="btn small danger" onclick="pvDeleteRender('${r.id}')">${icon('trash')}</button>
        </div>

  `;
}
function pvViewRender(id){
  const r = Data.poolRenders().find(x=>x.id===id);
  if(!r) return;
  pcCounter++;
  const cid = 'pvh'+pcCounter;
  openModal(`<h3 class="modal-title">${esc(r.clientNom)} — ${esc(r.modelNom)}</h3>

      <div class="after-wrap" style="width:50%;"><img src="${r.resultUrl}" style="width:200%;"></div>
      <span class="tag left">Avant</span><span class="tag right">Après</span>
      <input type="range" min="0" max="100" value="50" oninput="updatePhotoCompare('${cid}', this.value)">
    </div>
    <div class="btn-row mt16"><a class="btn" href="${r.resultUrl}" download="pool-vision-render.jpg">${icon('download')}Télécharger</a></div>`);
}
function pvDeleteRender(id){
  if(!confirm('Supprimer ce rendu ?')) return;
  Data.setPoolRenders(Data.poolRenders().filter(x=>x.id!==id));
  toast('Rendu supprimé.');
  renderView();
}

registerModule({id:'pool-vision', nom:'Pool Vision AI', icone:'wand', render: renderPoolVision, init: null});

/* =========================================================
   ROUTER / NAV / INIT
   ========================================================= */
let currentTab = 'dashboard';
function setTab(id){ currentTab = id; renderView(); }
function buildNav(){
  const tabs = getAllTabs();
  document.getElementById('tabsNav').innerHTML = tabs.map(t=>`<button class="nav-item" data-tab="${t.id}" onclick="setTab('${t.id}')">${icon(t.icone)}${t.nom}</button>`).join('');
}
function renderView(){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.tab===currentTab));
  const tabs = getAllTabs();
  const tab = tabs.find(t=>t.id===currentTab) || tabs[0];
  document.getElementById('view').innerHTML = tab.render(clientConfig);
  if(tab.init) tab.init(clientConfig);
  window.scrollTo({top:0, behavior:'instant'});
  closeSidebar();
}
function applyCharte(){
  const root = document.documentElement.style;
  const p = clientConfig.charte.couleurPrincipale, a = clientConfig.charte.couleurAccent;
  root.setProperty('--primary', p);
  root.setProperty('--accent', a);
  root.setProperty('--primary-l1', shade(p,-0.15));
  root.setProperty('--primary-l2', shade(p,0.2));
  root.setProperty('--accent-l1', shade(a,0.2));
  document.getElementById('brandName').textContent = 'Aplomb';
  document.getElementById('brandSub').textContent = `${clientConfig.entreprise.nom} — ${clientConfig.entreprise.ville}`;
  document.getElementById('logoBadge').textContent = clientConfig.entreprise.nom.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  document.title = `Aplomb — ${clientConfig.entreprise.nom}`;
}
function resetDemo(){
  if(!confirm('Réinitialiser toutes les données de démonstration ?')) return;
  seedIfNeeded(true);
  toast('Démo réinitialisée.');
  currentTab = 'dashboard';
  renderView();
}
function init(){
  applyCharte();
  seedIfNeeded(false);
  buildNav();
  renderView();
}
document.addEventListener('DOMContentLoaded', init);
</script>
