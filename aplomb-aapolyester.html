<style>

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}

}
nav.tabs::-webkit-scrollbar{display:none;}
.tab-btn{

  .grid-3{grid-template-columns:repeat(3,1fr);}

.section-title{

.section-title h2{margin:0;font-size:19px;color:var(--primary);}
.section-title .sub{color:var(--muted);font-size:12.5px;}

.kpi{

  overflow:hidden;

}
.kpi small{opacity:0.65;font-size:11.5px;text-transform:uppercase;letter-spacing:0.6px;}
.kpi .val{font-size:26px;font-weight:700;margin-top:4px;}
.kpi .delta{font-size:11.5px;margin-top:6px;color:var(--muted);}
.kpi.accent{border-left-color:var(--accent);}
.kpi.accent .val{color:var(--accent);}
.kpi.danger{border-left-color:var(--danger);}
.kpi.danger .val{color:var(--danger);}

.btn{

}
.btn.secondary{background:#fff;color:var(--text);border:1.5px solid var(--border);}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent);}

.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn.small{padding:6px 10px;font-size:12px;border-radius:6px;}
.btn:disabled{opacity:0.4;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

.badge{

.badge.envoye{background:var(--warn-bg);color:var(--warn);border-color:#ddd;}

.badge.refuse{background:var(--danger-bg);color:var(--danger);border-color:#f0c6c1;}

th{

.list-card{padding:0;overflow:hidden;}

const TODAY = new Date();
function daysAgo(n){ const d = new Date(TODAY); d.setDate(d.getDate()-n); d.setHours(9,0,0,0); return d; }
function daysFromNow(n){ return daysAgo(-n); }
function iso(d){ return new Date(d).toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDateLong(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}); }
function fmtEUR(n){ return (Math.round(n*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €'; }
function daysBetween(a,b){ const ms = new Date(iso(b)) - new Date(iso(a)); return Math.round(ms/86400000); }
function daysSince(d){ return daysBetween(d, TODAY); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shade(hex, pct){
  hex = hex.replace('#','');
  const num = parseInt(hex,16);
  let r=(num>>16)&255, g=(num>>8)&255, b=num&255;
  if(pct>0){ r+=(255-r)*pct; g+=(255-g)*pct; b+=(255-b)*pct; } else { r*=(1+pct); g*=(1+pct); b*=(1+pct); }
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}
const MOIS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function monthName(idx){ return MOIS_FR[((idx%12)+12)%12]; }
function nextOccurrence(monthIdx){
  const now = new Date(TODAY); const y = now.getFullYear();
  let d = new Date(y, monthIdx, 15);
  if(d < now) d = new Date(y+1, monthIdx, 15);

}

/* Modal / toast */
function openModal(html){
  document.getElementById('modalBox').innerHTML = '<button class="modal-close" onclick="closeModal()">✕</button>' + html;
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.add('hidden');
  document.getElementById('modalBox').innerHTML = '';
}
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.add('hidden'), 3200);

function seedIfNeeded(force){
  if(force || !store.get('seeded_v1', false)){
    const seed = buildSeed();
    store.set('clients', seed.clients);
    store.set('prestations', seed.prestations);
    store.set('devis', seed.devis);
    store.set('factures', seed.factures);
    store.set('contrats', seed.contrats);
    store.set('chantiers', seed.chantiers);
    store.set('avisDemandes', seed.avisDemandes);
    store.set('avisConfig', seed.avisConfig);
    store.set('seeded_v1', true);
  }
}

    sms:(f,c)=>`AA Polyester: la facture ${f.numero} est toujours impayée (échéance ${fmtDate(f.dateEcheance)}). Merci de régulariser sous 8 jours.`},
  {jour:30, label:'Dernier avis avant mise en demeure',
    email:(f,c)=>`Madame, Monsieur,\n\nEn l’absence de règlement de la facture ${f.numero} d’un montant de ${fmtEUR(f.totaux.ttc)} TTC, échue depuis le ${fmtDate(f.dateEcheance)}, nous vous informons qu’une mise en demeure va être émise. Nous vous invitons à régulariser votre situation sans délai.\n\nAA Polyester`,
    sms:(f,c)=>`AA Polyester: DERNIER AVIS avant mise en demeure — facture ${f.numero} (${fmtEUR(f.totaux.ttc)}) impayée depuis le ${fmtDate(f.dateEcheance)}. Contactez-nous au 04 68 00 00 00.`},
];

function joursEcoulesDevis(d){
  if(d.relanceSimOffset!=null) return d.relanceSimOffset;
  if(!d.dateEnvoi) return null;
  return daysSince(d.dateEnvoi);
}
function joursRetardFacture(f){
  if(f.relanceSimOffset!=null) return f.relanceSimOffset;
  return daysSince(f.dateEcheance);
}

function addLigneToForm(pid){

  const box = document.getElementById('ndv-lignes');

    <div class="flex-between" style="padding:6px 0;border-bottom:1px dashed var(--border);">

function saveNewDevis(){
  if(!window._ndvLignes.length){ toast('Ajoutez au moins une ligne.'); return; }
  const clientId = document.getElementById('ndv-client').value;
  const all = Data.devis();
  const numero = clientConfig.facturation.prefixeDevis + '-2026-' + String(50+all.length).padStart(3,'0');
  const nd = {id: uid('dv'), numero, clientId, statut:'brouillon', dateCreation: iso(TODAY), dateEnvoi:null, lignes: window._ndvLignes, relanceSimOffset:null};
  nd.totaux = calcTotaux(nd.lignes);
  Data.setDevis([nd, ...all]);
  closeModal();
  toast(`Devis ${numero} créé en brouillon.`);
  setTab('devis');

function envoyerDevis(id){
  const all = Data.devis();
  const d = all.find(x=>x.id===id);
  d.statut = 'envoye'; d.dateEnvoi = iso(TODAY); d.relanceSimOffset = null;
  Data.setDevis(all);
  toast(`Devis ${d.numero} envoyé par email et SMS.`);
  renderView();
}
function statuerDevis(id, statut){
  const all = Data.devis();
  const d = all.find(x=>x.id===id);
  d.statut = statut; d.dateReponse = iso(TODAY);
  Data.setDevis(all);
  toast(`Devis ${d.numero} marqué ${statut==='accepte'?'accepté':'refusé'}. Les relances s’arrêtent.`);
  renderView();
}
function convertirDevisEnFacture(devisId){
  const d = Data.devisOne(devisId);
  const factures = Data.factures();
  const numero = clientConfig.facturation.prefixeFacture + '-2026-' + String(30+factures.length).padStart(3,'0');
  const nf = {id: uid('fa'), numero, clientId:d.clientId, devisId:d.id, statut:'impayee', dateEmission: iso(TODAY), dateEcheance: iso(daysFromNow(30)), lignes:d.lignes, totaux:d.totaux};
  Data.setFactures([nf, ...factures]);

}

function renderContrats(){
  const contrats = Data.contrats();
  const caRecurrent = contrats.reduce((s,c)=>s+c.montant,0);
  const clientsAvecContrat = new Set(contrats.map(c=>c.clientId));
  const clientsSansContrat = Data.clients().filter(c=>!clientsAvecContrat.has(c.id));

  const monthCounts = new Array(12).fill(0);
  contrats.forEach(c=>monthCounts[c.mois]++);

  const rows = contrats.slice().sort((a,b)=>{
    const na = nextOccurrence(a.mois), nb = nextOccurrence(b.mois); return na-nb;
  }).map(c=>{
    const cl = Data.client(c.clientId);
    const next = nextOccurrence(c.mois);
    const joursRestants = daysBetween(TODAY, next);
    const relanceDue = joursRestants<=45;
    return `<tr>
      <td>${esc(cl.nom)}</td>
      <td>${esc(c.type)}</td>
      <td>${fmtDate(next)} <span class="small">(${joursRestants}j)</span></td>
      <td class="right mono">${fmtEUR(c.montant)}</td>
      <td>${relanceDue ? `<span class="badge envoye">Relance renouvellement active</span>` : `<span class="badge info">À venir</span>`}</td>
      <td class="right">${relanceDue ? `<button class="btn accent small" onclick="genererDevisRenouvellement('${c.id}')">Réponse positive → devis</button>` : ''}</td>
    </tr>`;
  }).join('');

  return `
    <div class="section-title"><h2>Contrats d’entretien</h2><button class="btn accent" onclick="openContratForm()">+ Nouveau contrat</button></div>
    <div class="grid grid-3">
      <div class="kpi"><small>CA récurrent sécurisé</small><div class="val">${fmtEUR(caRecurrent)}</div><div class="delta">par an</div></div>
      <div class="kpi accent"><small>Contrats actifs</small><div class="val">${contrats.length}</div><div class="delta">${clientsAvecContrat.size} clients sous contrat</div></div>
      <div class="kpi"><small>Clients sans contrat</small><div class="val">${clientsSansContrat.length}</div><div class="delta">à relancer</div></div>
    </div>

    <div class="section-title"><h2 style="font-size:16px;">Calendrier annuel des interventions</h2><span class="sub">Pic hivernages (oct-nov) et mises en service (mars-avr)</span></div>
    <div class="card"><canvas id="chartContrats" height="200"></canvas></div>

    <div class="section-title"><h2 style="font-size:16px;">Liste des contrats actifs</h2></div>
    <div class="card list-card table-wrap">
      <table>
        <thead><tr><th>Client</th><th>Type</th><th>Prochaine intervention</th><th class="right">Montant</th><th>Relance</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>

    <div class="section-title"><h2 style="font-size:16px;">Clients sans contrat</h2></div>
    <div class="card">
      ${clientsSansContrat.length ? `<ul class="timeline">${clientsSansContrat.map(c=>`<li><div class="tl-dot future">!</div><div class="flex-between" style="flex:1;"><div><b>${esc(c.nom)}</b><div class="small">${esc(c.ville)} — jamais reconduit</div></div><button class="btn secondary small" onclick="openContratForm('${c.id}')">Proposer un contrat</button></div></li>`).join('')}</ul>` : `<div class="empty-note">Tous les clients sont sous contrat.</div>`}
    </div>
  `;

  if(typeof Chart==='undefined'){ chartFallback('chartContrats','Graphique indisponible hors connexion (Chart.js non chargé).'); return; }
  const contrats = Data.contrats();

function genererDevisRenouvellement(contratId){
  const ct = Data.contrats().find(c=>c.id===contratId);
  const cl = Data.client(ct.clientId);
  const prestaId = ct.type.toLowerCase().includes('hivernage') ? 'p10' : 'p11';
  const presta = Data.prestations().find(p=>p.id===prestaId);
  const ligne = {designation: presta.designation, unite: presta.unite, qte:1, prixUnitaire: presta.prix, tva: presta.tva};
  const all = Data.devis();
  const numero = clientConfig.facturation.prefixeDevis + '-2026-' + String(50+all.length).padStart(3,'0');
  const nd = {id: uid('dv'), numero, clientId: ct.clientId, statut:'brouillon', dateCreation: iso(TODAY), dateEnvoi:null, lignes:[ligne], relanceSimOffset:null};
  nd.totaux = calcTotaux(nd.lignes);
  Data.setDevis([nd, ...all]);
  toast(`Réponse positive de ${cl.nom} — devis ${numero} pré-rempli créé automatiquement.`);
  renderView();
}
registerModule({id:'contrats-entretien', nom:'Contrats', icone:'📅', render: renderContrats, init: initContrats});

/* =========================================================
   MODULE : SUIVI DE CHANTIER
   ========================================================= */
const PHASES = ['Diagnostic','Vidange','Préparation / ponçage','Traitement osmose','Application gelcoat','Finitions et margelles','Remise en eau','Réception'];
let chantierView = 'kanban';
function renderChantiers(){
  const chantiers = Data.chantiers();
  const enRetard = chantiers.filter(c=>c.retard && c.phaseActuelle<7);
  const semaine = chantiers.filter(c=>c.phaseActuelle<7);

  return `
    <div class="section-title"><h2>Suivi de chantier</h2>
      <div class="btn-row"><button class="chip ${chantierView==='kanban'?'active':''}" onclick="chantierView='kanban';renderView()">Kanban</button><button class="chip ${chantierView==='liste'?'active':''}" onclick="chantierView='liste';renderView()">Liste</button></div>
    </div>

    ${enRetard.length ? `<div class="card" style="border-left:4px solid var(--danger);"><b style="color:var(--danger);">⚠ Chantiers en retard</b><ul class="small mt8">${enRetard.map(c=>`<li>${esc(c.nom)} — ${esc(Data.client(c.clientId).nom)} : phase « ${PHASES[c.phaseActuelle]} » en retard</li>`).join('')}</ul></div>` : ''}

    <div class="section-title"><h2 style="font-size:16px;">Planning de la semaine</h2></div>
    <div class="card">
      <ul class="timeline">
        ${semaine.map(c=>{ const ph=c.phases[c.phaseActuelle]; return `<li><div class="tl-dot next">${new Date(ph.prevue).getDate()}</div><div><b>${esc(c.nom)}</b> — ${esc(Data.client(c.clientId).nom)}<div class="small">${PHASES[c.phaseActuelle]} — prévu le ${fmtDate(ph.prevue)}</div></div></li>`; }).join('')}
      </ul>
    </div>

    <div class="section-title"><h2 style="font-size:16px;">Chantiers</h2></div>
    ${chantierView==='kanban' ? renderKanban(chantiers) : renderChantierListe(chantiers)}
  `;
}
function renderKanban(chantiers){
  return `<div class="kanban">
    ${PHASES.map((ph,i)=>{
      const items = chantiers.filter(c=>c.phaseActuelle===i);
      return `<div class="kanban-col"><h4>${ph}</h4>
        ${items.map(c=>`<div class="kanban-card" onclick="openChantierDetail('${c.id}')"><b>${esc(c.nom)}</b>${esc(Data.client(c.clientId).nom)}${c.retard?'<div class="small" style="color:var(--danger);">⚠ retard</div>':''}</div>`).join('') || `<div class="small" style="padding:6px;">—</div>`}
      </div>`;
    }).join('')}
  </div>`;
}
function renderChantierListe(chantiers){
  return `<div class="grid grid-3">
    ${chantiers.map(c=>{
      const cl = Data.client(c.clientId);
      const pct = Math.round((c.phaseActuelle)/(PHASES.length-1)*100);
      return `<div class="card" style="cursor:pointer;" onclick="openChantierDetail('${c.id}')">
        <div class="flex-between"><b>${esc(c.nom)}</b>${c.phaseActuelle===7?`<span class="badge accepte">Terminé</span>`:c.retard?`<span class="badge refuse">Retard</span>`:`<span class="badge envoye">En cours</span>`}</div>
        <div class="small mt8">${esc(cl.nom)} — ${esc(cl.ville)}</div>
        <div class="small mt8">${PHASES[c.phaseActuelle]}</div>
        <div class="progress-track mt8"><div class="progress-fill" style="width:${pct}%;"></div></div>
      </div>`;
    }).join('')}
  </div>`;
}
function openChantierDetail(id){
  const c = Data.chantierOne(id);
  const cl = Data.client(c.clientId);
  const pct = Math.round((c.phaseActuelle)/(PHASES.length-1)*100);
  const photoPhases = Object.keys(c.photos||{});
  openModal(`
    <h3 class="modal-title">${esc(c.nom)}</h3>
    <div class="small">${esc(cl.nom)} — ${esc(cl.ville)} · Piscine ${esc(cl.piscine.type)}, ${cl.piscine.volume} m³</div>
    <div class="progress-track mt16"><div class="progress-fill" style="width:${pct}%;"></div></div>
    <ul class="timeline mt8">
      ${c.phases.map((ph,i)=>{
        const done = i < c.phaseActuelle || (i===c.phaseActuelle && ph.reelle);
        const current = i===c.phaseActuelle && !ph.reelle;
        return `<li>
          <div class="tl-dot ${done?'done':current?'next':'future'}">${done?'✓':i+1}</div>
          <div style="flex:1;">
            <div class="flex-between"><b>${PHASES[i]}</b><span class="small">Prévu ${fmtDate(ph.prevue)}${ph.reelle?` · Réel ${fmtDate(ph.reelle)}`:''}</span></div>
            ${ph.notes ? `<div class="small">${esc(ph.notes)}</div>` : ''}
            ${c.photos && c.photos[PHASES[i]] ? renderPhotoComparator(c.id, PHASES[i], c.photos[PHASES[i]]) : ''}
          </div>
        </li>`;
      }).join('')}
    </ul>
    <div class="btn-row mt16">
      ${c.phaseActuelle<7 ? `<button class="btn accent" onclick="avancerPhase('${c.id}')">Simuler changement de phase</button>` : `<span class="badge accepte">Chantier réceptionné</span>`}
      <button class="btn secondary" onclick="voirVueClient('${c.id}')">Voir la vue client</button>
    </div>
  `);
}
let pcCounter = 0;
function placeholderPhoto(label){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440"><rect width="100%" height="100%" fill="${clientConfig.charte.couleurAccent}"/><text x="50%" y="50%" fill="#ffffff" font-family="sans-serif" font-size="24" text-anchor="middle" dominant-baseline="middle">${label}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
function onPhotoError(img, label){
  img.onerror = null;
  img.src = placeholderPhoto(label);
}
function renderPhotoComparator(chantierId, phaseName, photos){
  pcCounter++;
  const cid = 'pc'+pcCounter;
  return `
    <div class="photo-compare mt8" id="${cid}">
      <img src="${photos.avant}" onerror="onPhotoError(this,'Photo avant')">
      <div class="after-wrap" style="width:50%;"><img src="${photos.apres}" style="width:200%;" onerror="onPhotoError(this,'Photo après')"></div>
      <span class="tag left">Avant</span><span class="tag right">Après</span>
      <input type="range" min="0" max="100" value="50" oninput="updatePhotoCompare('${cid}', this.value)">
    </div>
  `;
}
function updatePhotoCompare(cid, val){
  const box = document.getElementById(cid);
  if(!box) return;
  box.querySelector('.after-wrap').style.width = val+'%';
  box.querySelector('.after-wrap img').style.width = (10000/val)+'%';
}
function avancerPhase(id){
  const all = Data.chantiers();
  const c = all.find(x=>x.id===id);
  c.phases[c.phaseActuelle].reelle = iso(TODAY);
  if(c.phaseActuelle < 7){
    c.phaseActuelle++;
    c.retard = false;
  }
  Data.setChantiers(all);
  toast(`Phase « ${PHASES[c.phaseActuelle-1]||PHASES[0]} » terminée. Notification envoyée au client.`);
  if(c.phaseActuelle===7){
    const cl = Data.client(c.clientId);
    const ad = {id: uid('ad'), clientId: c.clientId, chantierId: c.id, dateEnvoi: iso(daysFromNow(2)), statut:'envoyee'};
    Data.setAvisDemandes([ad, ...Data.avisDemandes()]);
    toast(`Chantier réceptionné — demande d’avis Google programmée à J+2 pour ${cl.nom}.`);
  }
  closeModal();
  renderView();
}
function voirVueClient(id){
  const c = Data.chantierOne(id);
  const cl = Data.client(c.clientId);
  const pct = Math.round((c.phaseActuelle)/(PHASES.length-1)*100);
  openModal(`
    <h3 class="modal-title">Vue client — lien de suivi (simulation)</h3>
    <p class="small">C’est l’écran que ${esc(cl.nom)} ouvre depuis son téléphone en cliquant sur le lien reçu par SMS, sans créer de compte.</p>
    <div class="phone-frame">
      <div class="pf-top">Suivi de mon chantier — AA Polyester</div>
      <div class="pf-body">
        <b>${esc(c.nom)}</b>
        <div class="progress-track mt8"><div class="progress-fill" style="width:${pct}%;"></div></div>
        <div class="small mt8">Étape en cours : <b>${PHASES[Math.min(c.phaseActuelle, 7)]}</b></div>
        <ul class="timeline mt16">
          ${c.phases.slice(0, c.phaseActuelle+1).map((ph,i)=>`<li><div class="tl-dot ${ph.reelle?'done':'next'}">${ph.reelle?'✓':i+1}</div><div>${PHASES[i]}${ph.reelle?` — ${fmtDate(ph.reelle)}`:' — en cours'}</div></li>`).join('')}
        </ul>
        ${Object.keys(c.photos||{}).length ? `<div class="small mt8"><b>Photos</b></div>${Object.entries(c.photos).map(([ph,p])=>renderPhotoComparator(c.id, ph, p)).join('')}` : ''}
      </div>
    </div>
  `);
}
registerModule({id:'suivi-chantier', nom:'Chantiers', icone:'🏗️', render: renderChantiers, init: null});

/* =========================================================
   ROUTER / NAV / INIT
   ========================================================= */
let currentTab = 'dashboard';
function setTab(id){ currentTab = id; renderView(); }
function buildNav(){
  const tabs = getAllTabs();
  document.getElementById('tabsNav').innerHTML = tabs.map(t=>`<button class="tab-btn" data-tab="${t.id}" onclick="setTab('${t.id}')"><span class="ic">${t.icone}</span>${t.nom}</button>`).join('');
}
function renderView(){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===currentTab));
  const tabs = getAllTabs();
  const tab = tabs.find(t=>t.id===currentTab) || tabs[0];
  document.getElementById('view').innerHTML = tab.render(clientConfig);
  if(tab.init) tab.init(clientConfig);
  window.scrollTo({top:0, behavior:'instant'});
}
function applyCharte(){
  const root = document.documentElement.style;
  const p = clientConfig.charte.couleurPrincipale, a = clientConfig.charte.couleurAccent;
  root.setProperty('--primary', p);
  root.setProperty('--accent', a);
  root.setProperty('--primary-l1', shade(p,0.18));
  root.setProperty('--primary-l2', shade(p,0.32));
  root.setProperty('--accent-l1', shade(a,0.25));
  document.getElementById('brandName').textContent = 'Aplomb';
  document.getElementById('brandSub').textContent = `${clientConfig.entreprise.nom} — ${clientConfig.entreprise.ville}`;
  document.getElementById('logoBadge').textContent = clientConfig.entreprise.nom.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  document.title = `Aplomb — ${clientConfig.entreprise.nom}`;
}
function updateClock(){
  document.getElementById('clockBox').textContent = TODAY.toLocaleDateString('fr-FR',{weekday:'short', day:'2-digit', month:'short', year:'numeric'});
}
function resetDemo(){
  if(!confirm('Réinitialiser toutes les données de démonstration ?')) return;
  seedIfNeeded(true);
  toast('Démo réinitialisée.');
  currentTab = 'dashboard';
  renderView();
}
function init(){
  applyCharte();
  seedIfNeeded(false);
  buildNav();
  updateClock();
  renderView();
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
