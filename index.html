<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SANITENERGIE — Tableau de bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
--canvas:#0F1923;--surface:#19232F;--surf2:#1F2D3D;
--ink:#E8EAED;--inkSoft:#B4BCCE;--muted:#6B7490;--line:#273040;
--cobalt:#2BA8DC;--cobaltSoft:#0C2E3D;
--terra:#E05A3A;--terraSoft:#2E1810;
--sage:#3AAB6A;--sageSoft:#142A1E;
--ochre:#D4A43C;--ochreSoft:#2A2010;
--violet:#8B7CF6;--violetSoft:#1E1B4B;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:14px;line-height:1.5}
h1,h2,h3,h4,.num,.oxa{font-family:'Oxanium',sans-serif}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--canvas)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
a{color:inherit;text-decoration:none}

.app{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--surface);border-right:1px solid var(--line);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:50}
.brand{padding:22px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.brand .logo{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--cobalt),var(--violet));display:flex;align-items:center;justify-content:center;font-family:'Oxanium';font-weight:800;font-size:18px;color:#fff}
.brand .bn{font-family:'Oxanium';font-weight:700;font-size:16px;letter-spacing:.5px}
.brand .bs{font-size:11px;color:var(--muted)}
.nav{flex:1;padding:14px 12px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:9px;color:var(--inkSoft);cursor:pointer;margin-bottom:3px;font-weight:500;position:relative;transition:.15s}
.nav-item:hover{background:var(--surf2);color:var(--ink)}
.nav-item.active{background:var(--cobaltSoft);color:var(--cobalt)}
.nav-item.active svg{stroke:var(--cobalt)}
.nav-item svg{width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:1.8;flex-shrink:0}
.nav-item .badge{margin-left:auto;background:var(--terra);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;font-family:'Oxanium'}
.nav-foot{padding:12px;border-top:1px solid var(--line)}
.main{flex:1;margin-left:248px;min-width:0}
.topbar{height:64px;border-bottom:1px solid var(--line);background:rgba(15,25,35,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:40;display:flex;align-items:center;padding:0 28px;gap:18px}
.topbar h1{font-size:19px;font-weight:700}
.topbar .sub{font-size:12px;color:var(--muted)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.rge{display:flex;align-items:center;gap:7px;background:var(--sageSoft);color:var(--sage);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid rgba(58,171,106,.3)}
.userchip{display:flex;align-items:center;gap:9px}
.userchip .av{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--terra),var(--ochre));display:flex;align-items:center;justify-content:center;font-family:'Oxanium';font-weight:700;color:#fff;font-size:13px}
.content{padding:28px}
.view{display:none}
.view.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.section-title{font-size:13px;font-weight:600;color:var(--inkSoft);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.mt{margin-top:20px}
.row{display:flex;align-items:center}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:18px 20px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%}
.kpi.c-cobalt::before{background:var(--cobalt)}.kpi.c-terra::before{background:var(--terra)}
.kpi.c-sage::before{background:var(--sage)}.kpi.c-ochre::before{background:var(--ochre)}.kpi.c-violet::before{background:var(--violet)}
.kpi .k-label{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.kpi .k-val{font-family:'Oxanium';font-size:30px;font-weight:700;margin-top:6px}
.kpi .k-sub{font-size:12px;margin-top:4px;color:var(--inkSoft)}
.up{color:var(--sage)}.down{color:var(--terra)}

.hero{background:linear-gradient(120deg,var(--terraSoft),var(--surface));border:1px solid rgba(224,90,58,.35);border-radius:14px;padding:22px 24px;display:flex;align-items:center;gap:22px}
.hero .hicon{width:48px;height:48px;border-radius:11px;background:var(--terra);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hero .hicon svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2}
.hero .ht{font-size:13px;color:var(--inkSoft)}
.hero .hv{font-family:'Oxanium';font-size:26px;font-weight:700;color:var(--terra)}

.btn{display:inline-flex;align-items:center;gap:7px;background:var(--surf2);border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:9px;font-family:'Space Grotesk';font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--cobalt);color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.btn.primary:hover{background:#229fd4;color:#fff}
.btn.danger{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.danger:hover{background:#cf4e30;color:#fff}
.btn.sage{background:var(--sage);border-color:var(--sage);color:#fff}
.btn.sage:hover{background:#32935a;color:#fff}
.btn.sm{padding:6px 12px;font-size:12px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;font-family:'Oxanium'}
.t-signe{background:var(--sageSoft);color:var(--sage)}
.t-dormant{background:var(--ochreSoft);color:var(--ochre)}
.t-refuse{background:var(--terraSoft);color:var(--terra)}
.t-attente{background:var(--cobaltSoft);color:var(--cobalt)}
.t-retard{background:var(--terraSoft);color:var(--terra)}
.t-payee{background:var(--sageSoft);color:var(--sage)}
.t-encours{background:var(--cobaltSoft);color:var(--cobalt)}
.t-planifie{background:var(--ochreSoft);color:var(--ochre)}
.t-termine{background:var(--sageSoft);color:var(--sage)}
.t-actif{background:var(--sageSoft);color:var(--sage)}
.t-prospect{background:var(--violetSoft);color:var(--violet)}
.chip{display:inline-block;background:var(--surf2);border:1px solid var(--line);color:var(--inkSoft);padding:2px 9px;border-radius:14px;font-size:11px;margin-right:5px}

.pbar{height:8px;background:var(--surf2);border-radius:6px;overflow:hidden}
.pbar>span{display:block;height:100%;border-radius:6px;background:var(--cobalt)}

.lcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;transition:.15s;margin-bottom:12px}
.lcard:hover{border-color:var(--cobalt);transform:translateY(-1px)}
.lcard .lc-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.lcard .lc-ref{font-family:'Oxanium';font-weight:700;color:var(--cobalt);font-size:14px}
.lcard .lc-amt{margin-left:auto;font-family:'Oxanium';font-weight:700;font-size:17px}
.lcard .lc-meta{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.flash{animation:flash 1.4s}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(58,171,106,.7);border-color:var(--sage)}100%{box-shadow:0 0 0 14px rgba(58,171,106,0);border-color:var(--line)}}

.tabs{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tab{padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--cobalt);border-color:var(--cobalt)}
.tabpane{display:none}.tabpane.active{display:block}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:13px 12px;border-bottom:1px solid var(--line);font-size:13px}
tr:hover td{background:var(--surf2)}
.best-row td{background:rgba(58,171,106,.06)}

.overlay{position:fixed;inset:0;background:rgba(8,14,20,.72);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:15px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;animation:pop .2s}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.modal .m-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.modal .m-body{padding:20px 22px}
.modal .m-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.m-close{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:22px;line-height:1}
.li-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.li-row .d{color:var(--inkSoft)}.li-row .q{color:var(--muted);font-size:12px}

.barchart{display:flex;align-items:flex-end;gap:16px;height:180px;padding-top:10px}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.barpair{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bar{width:14px;border-radius:4px 4px 0 0;position:relative;cursor:pointer;transition:.15s}
.bar.b-env{background:var(--surf2);border:1px solid var(--line)}
.bar.b-sig{background:var(--cobalt)}
.bar:hover{opacity:.8}
.bar .tip{position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:var(--canvas);border:1px solid var(--line);padding:4px 8px;border-radius:6px;font-size:11px;white-space:nowrap;display:none;z-index:5;font-family:'Oxanium'}
.bar:hover .tip{display:block}
.barcol .lab{font-size:11px;color:var(--muted)}

.hp{margin-bottom:14px}
.hp .hp-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.hp .hp-top .v{font-family:'Oxanium';font-weight:600}

.weekgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.daycell{background:var(--surf2);border:1px solid var(--line);border-radius:9px;padding:12px;text-align:center}
.daycell .dn{font-size:11px;color:var(--muted)}
.daycell .dv{font-family:'Oxanium';font-size:18px;font-weight:700;margin-top:4px}
.daycell.creux{border-color:var(--ochre);background:var(--ochreSoft)}
.creuxbadge{font-size:10px;color:var(--ochre);margin-top:4px;font-weight:600}

.funnel{display:flex;align-items:stretch;gap:0}
.fstage{flex:1;background:var(--surf2);border:1px solid var(--line);padding:16px;text-align:center}
.fstage:first-child{border-radius:10px 0 0 10px}
.fstage:last-child{border-radius:0 10px 10px 0}
.fstage .fl{font-size:11px;color:var(--muted);text-transform:uppercase}
.fstage .fv{font-family:'Oxanium';font-size:24px;font-weight:700;margin-top:4px}
.farr{display:flex;align-items:center;color:var(--muted);font-size:20px;padding:0 4px}

.calgrid{display:grid;grid-template-columns:54px repeat(5,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.calgrid>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;min-height:60px}
.calhd{background:var(--surf2);font-weight:600;text-align:center;font-size:12px;min-height:auto!important}
.caltime{color:var(--muted);font-size:11px;text-align:right;font-family:'Oxanium'}
.calev{border-radius:6px;padding:5px 8px;font-size:11px;font-weight:600;margin-bottom:4px}
.ev-clim{background:var(--cobaltSoft);color:var(--cobalt);border-left:3px solid var(--cobalt)}
.ev-sdb{background:var(--sageSoft);color:var(--sage);border-left:3px solid var(--sage)}
.ev-plomb{background:var(--violetSoft);color:var(--violet);border-left:3px solid var(--violet)}
.ev-chauf{background:var(--ochreSoft);color:var(--ochre);border-left:3px solid var(--ochre)}

.seqstep{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.seqstep:last-child{border:none}
.seqdot{width:30px;height:30px;border-radius:50%;background:var(--surf2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-family:'Oxanium';font-weight:700;color:var(--muted);flex-shrink:0}
.seqstep.active .seqdot{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.seqstep.danger .seqdot{background:var(--terra);border-color:var(--terra);color:#fff}

.av-c{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Oxanium';font-weight:700;color:#fff;flex-shrink:0}

.checkitem{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.checkbox{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.checkitem.done .checkbox{background:var(--sage);border-color:var(--sage)}
.checkitem.done .checkbox svg{stroke:#fff}
.checkbox svg{width:13px;height:13px;stroke:transparent;stroke-width:3;fill:none}
.checkitem.done .clab{color:var(--muted);text-decoration:line-through}

.jentry{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.jentry .jdate{font-family:'Oxanium';font-size:12px;color:var(--cobalt);font-weight:600;flex-shrink:0;width:50px}

.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--inkSoft);margin-bottom:6px;font-weight:500}
.field input,.field textarea,.field select{width:100%;background:var(--canvas);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);font-family:'Space Grotesk';font-size:13px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--cobalt)}
.radio-row{display:flex;gap:10px}
.radio-opt{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;cursor:pointer;font-size:13px}
.radio-opt.sel{border-color:var(--cobalt);background:var(--cobaltSoft);color:var(--cobalt)}

.search{width:100%;background:var(--canvas);border:1px solid var(--line);border-radius:9px;padding:11px 14px;color:var(--ink);font-family:'Space Grotesk';font-size:13px}
.search:focus{outline:none;border-color:var(--cobalt)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.alert-box{background:var(--ochreSoft);border:1px solid rgba(212,164,60,.35);color:var(--ochre);border-radius:10px;padding:13px 16px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">SE</div>
      <div><div class="bn">SANITENERGIE</div><div class="bs">Plomberie · Clim · Chauffe-eau</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="nav-foot">
      <div class="nav-item" data-view="reglages">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Réglages</span>
      </div>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div><h1 id="topTitle">Tableau de bord</h1><div class="sub">Lundi 22 juin 2026 · Pia (66)</div></div>
      <div class="right">
        <div class="rge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>Certifié RGE</div>
        <div class="userchip"><div class="av">MB</div><div><div style="font-size:13px;font-weight:600">Mickael Basty</div><div style="font-size:11px;color:var(--muted)">Gérant</div></div></div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
const DEVIS=[
{ref:'DV-047',client:'Jean-Pierre Roca',ville:'Perpignan',prestation:'Dépannage plomberie',montant:105,dateEnvoi:'12/06/2026',statut:'dormant',lignes:[{desc:"Main d'œuvre dépannage",qte:1,unit:'ff',pu:87.5,total:87.5},{desc:'Fournitures',qte:1,unit:'ff',pu:17.5,total:17.5}]},
{ref:'DV-046',client:'Marie Estève',ville:'Canet-en-Roussillon',prestation:'Installation climatisation',montant:3200,dateEnvoi:'10/06/2026',statut:'dormant',lignes:[{desc:"Main d'œuvre pose split",qte:2,unit:'j',pu:700,total:1400},{desc:'Unité intérieure + extérieure',qte:1,unit:'ff',pu:1500,total:1500},{desc:'Raccordements',qte:1,unit:'ff',pu:300,total:300}]},
{ref:'DV-045',client:'SCI Les Albères',ville:'Canet',prestation:'Rénovation salle de bain',montant:6500,dateEnvoi:'08/06/2026',statut:'signe',lignes:[{desc:"Main d'œuvre SDB",qte:5,unit:'j',pu:700,total:3500},{desc:'Équipements sanitaires',qte:1,unit:'ff',pu:1800,total:1800},{desc:'Carrelage et étanchéité',qte:1,unit:'ff',pu:1200,total:1200}]},
{ref:'DV-044',client:'Thomas Verdaguer',ville:'Perpignan',prestation:'Chauffe-eau thermodynamique',montant:2800,dateEnvoi:'07/06/2026',statut:'signe',lignes:[{desc:"Main d'œuvre pose ballon",qte:1,unit:'j',pu:800,total:800},{desc:'Ballon 200L Atlantic Calypso',qte:1,unit:'u',pu:1600,total:1600},{desc:'Raccordements',qte:1,unit:'ff',pu:400,total:400}]},
{ref:'DV-043',client:'Nathalie Puig',ville:'Pia',prestation:'Entretien climatisation',montant:95,dateEnvoi:'05/06/2026',statut:'refuse',lignes:[{desc:'Forfait entretien annuel split',qte:1,unit:'ff',pu:95,total:95}]},

  const q=(document.getElementById('clientSearch')?.value||'').toLowerCase();
  let list=CLIENTS.filter(c=>clientFilter==='all'||c.statut===clientFilter);
  if(q)list=list.filter(c=>c.nom.toLowerCase().includes(q)||c.ville.toLowerCase().includes(q));
  document.getElementById('clientGrid').innerHTML=list.map(c=>`<div class="lcard" onclick="openClientFiche(${c.id})">
    <div class="row" style="gap:12px;margin-bottom:10px"><div class="av-c" style="background:${avColor(c.id)}">${initials(c.nom)}</div>
    <div><div style="font-weight:700">${c.nom}</div><div style="font-size:12px;color:var(--muted)">${c.ville} · ${c.type}</div></div>
    <span class="tag t-${c.statut}" style="margin-left:auto">${c.statut==='actif'?'Actif':'Prospect'}</span></div>
    <div class="row"><span style="font-family:Oxanium;font-weight:700;font-size:17px">${fmt(c.ca)}</span></div>
    <div style="margin-top:8px">${c.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div>
  </div>`).join('')||'<div style="color:var(--muted)">Aucun client.</div>';
}
function openClientFiche(id){
  const c=CLIENTS.find(x=>x.id===id);
  document.getElementById('clients-list').style.display='none';
  const f=document.getElementById('clients-fiche');f.style.display='block';
  const nbDevis=DEVIS.filter(d=>d.client===c.nom).length;
  f.innerHTML=`
  <button class="btn sm" onclick="backToClients()">← Retour aux clients</button>
  <div class="card mt"><div class="row" style="gap:16px">
    <div class="av-c" style="width:58px;height:58px;font-size:20px;background:${avColor(c.id)}">${initials(c.nom)}</div>
    <div><h2 style="font-size:22px">${c.nom}</h2><div style="color:var(--muted);font-size:13px;margin-top:4px">${c.ville} · ${c.type} · ${c.tel}</div></div>
    <span class="tag t-${c.statut}" style="margin-left:auto">${c.statut==='actif'?'Actif':'Prospect'}</span>
  </div></div>
  <div class="grid2 mt">
    <div class="kpi c-cobalt"><div class="k-label">CA total</div><div class="k-val">${fmt(c.ca)}</div></div>
    <div class="kpi c-violet"><div class="k-label">Devis émis</div><div class="k-val">${nbDevis}</div></div>
  </div>
  <div class="grid2 mt">
    <div class="card"><div class="section-title">Historique</div>
      ${c.historique.map(h=>`<div class="row" style="gap:10px;padding:9px 0;border-bottom:1px solid var(--line)"><span class="dot" style="background:${h.includes('payée')||h.includes('signé')?'var(--sage)':h.includes('retard')||h.includes('refusé')?'var(--terra)':'var(--ochre)'}"></span><span>${h}</span></div>`).join('')}
    </div>
    <div class="card"><div class="section-title">Prochaine action</div>
      <div class="alert-box">${c.prochaine}</div>
      <div class="section-title mt">Note interne</div>
      <textarea id="clientNote-${id}" style="width:100%;min-height:90px;background:var(--canvas);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);font-family:Space Grotesk">${c.note}</textarea>
      <button class="btn sm primary mt" onclick="saveClientNote(${id})">Enregistrer la note</button>
      <span id="noteSaved-${id}" style="color:var(--sage);font-size:12px;margin-left:10px;display:none">✓ Enregistré</span>
    </div>
  </div>`;
}
function saveClientNote(id){
  const c=CLIENTS.find(x=>x.id===id);c.note=document.getElementById('clientNote-'+id).value;
  const s=document.getElementById('noteSaved-'+id);s.style.display='inline';setTimeout(()=>s.style.display='none',2000);
}
function backToClients(){document.getElementById('clients-fiche').style.display='none';document.getElementById('clients-list').style.display='block';}
