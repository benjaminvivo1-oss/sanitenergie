<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SaniPilot · Sanitenergie</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0D1117;--sur:#161C24;--bor:#1E2A36;--bor2:#243040;
  --ink:#E2E8F0;--soft:#94A3B8;--mute:#4B5A6E;
  --blue:#38BDF8;--blueBg:#0A2030;
  --red:#F87171;--redBg:#2A1414;
  --green:#4ADE80;--greenBg:#142414;
  --amber:#FBBF24;--amberBg:#241E08;
  --r:10px;--rL:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;line-height:1.6}
button,input,select,textarea{font-family:'Inter',sans-serif;font-size:14px}
.oxa{font-family:'Oxanium',sans-serif}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bor2);border-radius:3px}

/* ─── LAYOUT ─── */
.shell{display:flex;height:100vh;overflow:hidden}
.side{width:220px;flex-shrink:0;background:var(--sur);border-right:1px solid var(--bor);display:flex;flex-direction:column;overflow-y:auto}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.body{flex:1;overflow-y:auto;padding:32px}
.inner{max-width:860px;margin:0 auto}

/* ─── SIDEBAR ─── */
.logo{padding:20px 18px;border-bottom:1px solid var(--bor);display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-family:'Oxanium';font-weight:800;font-size:15px;color:#0a1a26;flex-shrink:0}
.logo-name{font-family:'Oxanium';font-weight:700;font-size:14px;color:var(--ink)}
.logo-sub{font-size:11px;color:var(--soft);margin-top:1px}
.nav{padding:12px 10px;flex:1;display:flex;flex-direction:column;gap:2px}
.nav-sep{height:1px;background:var(--bor);margin:8px 0}
.ni{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--soft);cursor:pointer;font-size:13.5px;font-weight:500;transition:background .12s,color .12s;user-select:none}
.ni:hover{background:rgba(255,255,255,.04);color:var(--ink)}
.ni.on{background:var(--blueBg);color:var(--blue)}
.ni svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}
.ni .dot{margin-left:auto;min-width:20px;height:20px;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Oxanium';padding:0 5px}
.side-foot{padding:14px 10px;border-top:1px solid var(--bor)}

/* ─── TOPBAR ─── */
.top{height:56px;border-bottom:1px solid var(--bor);display:flex;align-items:center;padding:0 32px;gap:16px;flex-shrink:0;background:var(--sur)}
.top-title{font-family:'Oxanium';font-weight:700;font-size:17px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.rge-badge{display:flex;align-items:center;gap:6px;background:var(--greenBg);color:var(--green);border:1px solid rgba(74,222,128,.2);border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600}
.avatar{width:32px;height:32px;border-radius:8px;background:var(--blueBg);color:var(--blue);font-family:'Oxanium';font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:1px solid var(--bor2)}

/* ─── PAGE HEADER ─── */
.ph{margin-bottom:28px}
.ph h2{font-family:'Oxanium';font-weight:700;font-size:20px;margin-bottom:4px}
.ph p{font-size:13.5px;color:var(--soft)}

/* ─── CARDS ─── */
.card{background:var(--sur);border:1px solid var(--bor);border-radius:var(--rL);padding:22px 24px}
.card+.card{margin-top:16px}
.card-title{font-size:11px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.8px;margin-bottom:16px}

/* ─── KPI ROW ─── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{background:var(--sur);border:1px solid var(--bor);border-radius:var(--rL);padding:18px 20px}
.kpi-label{font-size:12px;color:var(--soft);font-weight:500;margin-bottom:8px}
.kpi-val{font-family:'Oxanium';font-size:26px;font-weight:700;line-height:1}
.kpi-sub{font-size:12px;color:var(--soft);margin-top:6px}
.kpi-sub.up{color:var(--green)}.kpi-sub.down{color:var(--red)}.kpi-sub.warn{color:var(--amber)}

/* ─── ALERT BAND ─── */
.alert{background:var(--redBg);border:1px solid rgba(248,113,113,.25);border-radius:var(--rL);padding:16px 20px;display:flex;align-items:center;gap:16px;margin-bottom:16px}
.alert-val{font-family:'Oxanium';font-size:22px;font-weight:700;color:var(--red);white-space:nowrap}
.alert-txt{flex:1;font-size:13px;color:var(--soft);line-height:1.5}

/* ─── BUTTONS ─── */
.btn{display:inline-flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--bor2);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:.12s;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.prim{background:var(--blue);border-color:var(--blue);color:#0a1a26;font-weight:600}
.btn.prim:hover{opacity:.88}
.btn.dang{background:var(--redBg);border-color:rgba(248,113,113,.4);color:var(--red)}
.btn.dang:hover{border-color:var(--red)}
.btn.ok{background:var(--greenBg);border-color:rgba(74,222,128,.4);color:var(--green)}
.btn.ok:hover{border-color:var(--green)}
.btn.sm{padding:5px 11px;font-size:12px}

/* ─── BADGE ─── */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;font-family:'Oxanium';white-space:nowrap}
.b-signe{background:var(--greenBg);color:var(--green)}
.b-dormant{background:var(--amberBg);color:var(--amber)}
.b-refuse{background:var(--redBg);color:var(--red)}
.b-attente{background:var(--blueBg);color:var(--blue)}
.b-retard{background:var(--redBg);color:var(--red)}
.b-payee{background:var(--greenBg);color:var(--green)}
.b-encours{background:var(--blueBg);color:var(--blue)}
.b-planifie{background:var(--amberBg);color:var(--amber)}
.b-termine{background:var(--greenBg);color:var(--green)}
.b-actif{background:var(--greenBg);color:var(--green)}
.b-prospect{background:var(--amberBg);color:var(--amber)}

/* ─── TABLE ─── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;color:var(--soft);font-weight:600;text-transform:uppercase;letter-spacing:.6px;padding:9px 12px;border-bottom:1px solid var(--bor);text-align:left}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--bor);font-size:13.5px;color:var(--ink);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:rgba(255,255,255,.025)}
.tbl .num{font-family:'Oxanium';font-weight:600;font-size:15px}
.tbl .sub{font-size:12px;color:var(--soft);margin-top:2px}
.best-row td{background:rgba(74,222,128,.04)}

/* ─── PROGRESS ─── */
.prog{height:6px;background:var(--bor2);border-radius:4px;overflow:hidden}
.prog span{display:block;height:100%;border-radius:4px;background:var(--blue)}

/* ─── CHECKLIST ─── */
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bor);cursor:pointer}
.chk:last-child{border:none}
.chk-box{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--bor2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.12s}
.chk.done .chk-box{background:var(--green);border-color:var(--green)}
.chk-box svg{width:12px;height:12px;stroke:#111;stroke-width:3;fill:none;display:none}
.chk.done .chk-box svg{display:block}
.chk.done .chk-lbl{color:var(--soft);text-decoration:line-through}
.chk-lbl{font-size:13.5px}

/* ─── JOURNAL ─── */
.jentry{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--bor)}
.jentry:last-child{border:none}
.jentry .jd{font-family:'Oxanium';font-size:12px;font-weight:600;color:var(--blue);width:48px;flex-shrink:0;margin-top:1px}
.jentry .jt{font-size:13.5px;color:var(--soft)}

/* ─── CALENDAR ─── */
.cal-grid{display:grid;grid-template-columns:52px repeat(5,1fr);border:1px solid var(--bor);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.cal-grid>div{border-right:1px solid var(--bor);border-bottom:1px solid var(--bor);padding:8px 10px}
.cal-grid>div:last-child,.cal-grid>div:nth-child(6n){border-right:none}
.cal-hdr{background:rgba(255,255,255,.02);font-size:12px;font-weight:600;text-align:center;padding:10px 8px!important;min-height:auto!important}
.cal-time{font-size:11px;color:var(--mute);font-family:'Oxanium';text-align:right;padding-top:6px!important}
.cal-ev{border-radius:5px;padding:4px 8px;font-size:11.5px;font-weight:500;margin-bottom:3px}
.ev-clim{background:var(--blueBg);color:var(--blue);border-left:2px solid var(--blue)}
.ev-sdb{background:var(--greenBg);color:var(--green);border-left:2px solid var(--green)}
.ev-chauf{background:var(--amberBg);color:var(--amber);border-left:2px solid var(--amber)}
.ev-plomb{border:1px solid var(--bor2);color:var(--soft);border-left:2px solid var(--soft)}

/* ─── PBAR ─── */
.pbar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pbar-lbl{width:140px;font-size:13px;color:var(--soft);flex-shrink:0}
.pbar-track{flex:1;height:5px;background:var(--bor2);border-radius:3px;overflow:hidden}
.pbar-fill{height:100%;border-radius:3px}
.pbar-val{font-family:'Oxanium';font-size:13px;font-weight:600;width:64px;text-align:right;flex-shrink:0}

/* ─── FICHE (back + detail) ─── */
.back-btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--soft);background:none;border:none;cursor:pointer;margin-bottom:20px;padding:0}
.back-btn:hover{color:var(--ink)}
.info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bor);font-size:13.5px}
.info-row:last-child{border:none}
.info-lbl{color:var(--soft)}
.info-val{font-weight:500;text-align:right}

/* ─── MODAL ─── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.overlay.on{display:flex}
.modal{background:var(--sur);border:1px solid var(--bor);border-radius:var(--rL);width:min(580px,100%);max-height:88vh;overflow-y:auto;animation:mpop .2s}
@keyframes mpop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.mh{padding:20px 24px;border-bottom:1px solid var(--bor);display:flex;align-items:flex-start;gap:12px}
.mb{padding:20px 24px}
.mf{padding:16px 24px;border-top:1px solid var(--bor);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.mx{background:none;border:none;color:var(--soft);cursor:pointer;font-size:20px;line-height:1;margin-left:auto}
.li-r{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bor);font-size:13.5px}
.li-r:last-child{border:none}
.li-lbl{color:var(--soft)}

/* ─── FORM ─── */
.frow{margin-bottom:14px}
.flbl{display:block;font-size:12px;font-weight:500;color:var(--soft);margin-bottom:5px}
.finp{width:100%;background:var(--bg);border:1px solid var(--bor);border-radius:8px;padding:9px 12px;color:var(--ink);outline:none;transition:.12s}
.finp:focus{border-color:var(--blue)}
textarea.finp{resize:vertical;min-height:72px}
select.finp{cursor:pointer}
.radio-row{display:flex;gap:8px}
.radio-opt{flex:1;text-align:center;padding:9px;border:1px solid var(--bor);border-radius:8px;cursor:pointer;font-size:13px;color:var(--soft);transition:.12s}
.radio-opt.on{border-color:var(--blue);color:var(--blue);background:var(--blueBg)}

/* ─── SEARCH INPUT ─── */
.sinp{width:100%;background:var(--bg);border:1px solid var(--bor);border-radius:8px;padding:9px 14px;color:var(--ink);outline:none;transition:.12s}
.sinp:focus{border-color:var(--blue)}

/* ─── TABS ─── */
.tabs{display:flex;border-bottom:1px solid var(--bor);margin-bottom:20px}
.tab{padding:10px 16px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--soft);border-bottom:2px solid transparent;margin-bottom:-1px;transition:.12s}
.tab.on{color:var(--blue);border-color:var(--blue);font-weight:600}
.tabp{display:none}.tabp.on{display:block}

/* ─── MISC ─── */
.chip{display:inline-block;background:var(--bor2);color:var(--soft);padding:2px 8px;border-radius:12px;font-size:11px;margin:2px 2px 0 0}
.sec-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mt{margin-top:16px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.av-c{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Oxanium';font-weight:700;color:#fff;font-size:13px;flex-shrink:0}

@media(max-width:700px){
  .side{display:none}
  .kpis{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>

function buildNav(){

    `<div class="ni" data-v="${n.v}">
      <svg viewBox="0 0 24 24">${n.i}</svg>
      <span>${n.l}</span>
      ${n.dot?`<span class="dot">${n.dot}</span>`:''}
    </div>`
  ).join('');
  document.querySelectorAll('.ni').forEach(el=>el.addEventListener('click',()=>go(el.dataset.v)));
  document.querySelector('.side-foot .ni').addEventListener('click',()=>go('reglages'));
}

function go(v){
  document.querySelectorAll('.ni').forEach(el=>el.classList.toggle('on',el.dataset.v===v));
  document.getElementById('topTitle').textContent=TITLES[v]||v;
  document.getElementById('content').innerHTML=VIEWS[v]?VIEWS[v]():'';
  if(v==='dashboard')initDash();
  if(v==='fournisseurs'){curFourn='ballon';renderFourn('ballon');}
  if(v==='clients'){crmFilter='all';renderCl();}
  if(v==='calendrier'){calMode='week';calWeekOff=0;setTimeout(renderCal,0);}
}

    <div style="flex:1;text-align:center;padding:14px 10px;border-right:1px solid var(--bor)"><div style="font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">À relancer</div><div class="oxa" style="font-size:26px;font-weight:700;color:var(--red)">${DEVIS.filter(d=>d.statut==='dormant').length}</div><div style="font-size:12px;color:var(--soft);margin-top:3px">${fmt(DEVIS.filter(d=>d.statut==='dormant').reduce((a,d)=>a+d.montant,0))}</div></div>
    <div style="flex:1;text-align:center;padding:14px 10px;border-right:1px solid var(--bor)"><div style="font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">À facturer</div><div class="oxa" style="font-size:26px;font-weight:700;color:var(--amber)">${DEVIS.filter(d=>d.statut==='signe').length}</div><div style="font-size:12px;color:var(--soft);margin-top:3px">${fmt(DEVIS.filter(d=>d.statut==='signe').reduce((a,d)=>a+d.montant,0))}</div></div>
    <div style="flex:1;text-align:center;padding:14px 10px;border-right:1px solid var(--bor)"><div style="font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">Factures ouvertes</div><div class="oxa" style="font-size:26px;font-weight:700;color:var(--blue)">${FACTURES.filter(f=>f.statut!=='payee').length}</div><div style="font-size:12px;color:var(--red);margin-top:3px">dont ${FACTURES.filter(f=>f.statut==='en retard').length} en retard</div></div>
    <div style="flex:1;text-align:center;padding:14px 10px;background:var(--greenBg);border-radius:0 var(--r) var(--r) 0"><div style="font-size:11px;color:var(--green);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">Encaissé</div><div class="oxa" style="font-size:26px;font-weight:700;color:var(--green)">${FACTURES.filter(f=>f.statut==='payee').length}</div><div style="font-size:12px;color:var(--soft);margin-top:3px">${fmt(FACTURES.filter(f=>f.statut==='payee').reduce((a,f)=>a+f.montant,0))}</div></div>
  </div>
</div>
<div class="tabs">
  <div class="tab on" onclick="swTab(this,'t-devis')">Devis</div>
  <div class="tab" onclick="swTab(this,'t-fact')">Factures</div>
</div>
<div class="tabp on" id="t-devis">
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px"><button class="btn" onclick="openVoiceDevis()" title="Créer un devis par commande vocale"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> Vocal</button><button class="btn prim" onclick="openNewDevis()">+ Nouveau devis</button></div>
  <div class="card" style="padding:0;overflow:hidden">
    <table class="tbl"><thead><tr><th>Référence</th><th>Client · Ville</th><th>Prestation</th><th>Montant</th><th>Envoyé le</th><th>Statut</th></tr></thead>
    <tbody id="dtbody">${DEVIS.map(devisRow).join('')}</tbody></table>
  </div>
</div>
<div class="tabp" id="t-fact">
  <div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn prim">+ Nouvelle facture</button></div>
  <div class="card" style="padding:0;overflow:hidden">
    <table class="tbl"><thead><tr><th>Référence</th><th>Client</th><th>Prestation</th><th>TTC</th><th>Échéance</th><th>Statut</th><th></th></tr></thead>
    <tbody id="ftbody">${FACTURES.map(factRow).join('')}</tbody></table>
  </div>
</div>`;
};

function devisRow(d){return `<tr class="click" id="dr-${d.ref}" onclick="openDevis('${d.ref}')" ${rowAccent(d.statut)}><td><span class="oxa" style="color:var(--blue);font-weight:600">${d.ref}</span></td><td>${d.client}<div class="sub">${d.ville}</div></td><td style="color:var(--soft)">${d.prestation}</td><td><span class="num oxa">${fmt(d.montant)}</span></td><td style="color:var(--soft)">${d.dateEnvoi}</td><td id="dbadge-${d.ref}">${badge(d.statut)}</td></tr>`;}
function factRow(f){
  const acts=f.statut!=='payee'?`<div onclick="event.stopPropagation()" style="display:flex;gap:6px">
    ${f.statut==='en retard'?`<button class="btn sm dang" onclick="relancerF('${f.client}',this)">Relancer</button>`:''}
    <button class="btn sm ok" onclick="markPaid('${f.ref}',this)">Payée</button>
  </div>`:'';
  return `<tr class="click" id="fr-${f.ref}" onclick="openFact('${f.ref}')" ${rowAccent(f.statut)}><td><span class="oxa" style="color:var(--blue);font-weight:600">${f.ref}</span></td><td>${f.client}</td><td style="color:var(--soft)">${f.prestation}</td><td><span class="num oxa">${fmt(f.montant)}</span></td><td id="fech-${f.ref}" style="color:${f.statut==='en retard'?'var(--red)':'var(--soft)'}">${f.echeance}${f.jours?` <span style="font-size:11px">(+${f.jours}j)</span>`:''}</td><td id="fbadge-${f.ref}">${badge(f.statut)}</td><td>${acts}</td></tr>`;}

function swTab(el,id){
  el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));el.classList.add('on');
  document.querySelectorAll('.tabp').forEach(p=>p.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}

function lignes(ls){
  let tot=0;
  const rows=ls.map(l=>{tot+=l.total;return `<div class="li-r"><div><div>${l.desc}</div><div class="li-lbl" style="font-size:12px">${l.qte} ${l.unit} × ${fmt(l.pu)}</div></div><div class="oxa" style="font-weight:600">${fmt(l.total)}</div></div>`;}).join('');
  return rows+`<div class="li-r" style="border:none;margin-top:6px"><div style="font-weight:600">Total TTC</div><div class="oxa" style="font-weight:700;font-size:19px;color:var(--blue)">${fmt(tot)}</div></div>`;
}

function openDevis(ref){
  const d=DEVIS.find(x=>x.ref===ref);if(!d)return;
  const hasFact=FACTURES.some(f=>f.devisRef===d.ref);
  let foot=`<button class="btn" onclick="${mc()}">Fermer</button>`;
  if(d.statut==='dormant')foot+=`<button class="btn" onclick="relancerD('${d.client}',this)">Envoyer relance</button><button class="btn ok" onclick="markSigne('${d.ref}')">Marquer signé</button>`;
  if(d.statut==='signe'&&!hasFact)foot+=`<button class="btn prim" onclick="creerFact('${d.ref}')">Créer la facture</button>`;
  openM(`<div class="mh"><div><div class="oxa" style="font-weight:700;font-size:18px">${d.ref}</div><div style="color:var(--soft);font-size:13px;margin-top:3px">${d.client} · ${d.ville}</div></div>${badge(d.statut)}<button class="mx" onclick="${mc()}">×</button></div>
  <div class="mb"><div style="font-size:13px;color:var(--soft);margin-bottom:14px">${d.prestation} · envoyé le ${d.dateEnvoi}</div>${lignes(d.lignes)}</div>
  <div class="mf">${foot}</div>`);
}

function openFact(ref){
  const f=FACTURES.find(x=>x.ref===ref);if(!f)return;
  let foot=`<button class="btn" onclick="${mc()}">Fermer</button>`;
  if(f.statut==='en retard')foot+=`<button class="btn dang" onclick="relancerF('${f.client}',this)">Envoyer relance</button>`;
  if(f.statut!=='payee')foot+=`<button class="btn ok" onclick="markPaid('${f.ref}');${mc()}">Marquer payée</button>`;
  const devisLink=f.devisRef?`<div class="li-r"><div class="li-lbl">Devis lié</div><div><a style="color:var(--blue);cursor:pointer;font-weight:600" onclick="${mc()};openDevis('${f.devisRef}')">${f.devisRef} →</a></div></div>`:'';
  openM(`<div class="mh"><div><div class="oxa" style="font-weight:700;font-size:18px">${f.ref}</div><div style="color:var(--soft);font-size:13px;margin-top:3px">${f.client} · ${f.ville}</div></div>${badge(f.statut)}<button class="mx" onclick="${mc()}">×</button></div>
  <div class="mb">
    <div class="li-r"><div class="li-lbl">Émise le</div><div>${f.dateEmission}</div></div>
    <div class="li-r"><div class="li-lbl">Échéance</div><div style="color:${f.statut==='en retard'?'var(--red)':'inherit'}">${f.echeance}${f.jours?` — dépassée de ${f.jours} j`:''}</div></div>
    ${devisLink}
    <div class="li-r"><div class="li-lbl">Montant HT</div><div class="oxa" style="font-weight:600">${fmt(f.montantHT)}</div></div>
    <div class="li-r"><div class="li-lbl">TVA 10 %</div><div>${fmt(f.tva)}</div></div>
    <div class="li-r" style="border:none;margin-top:6px"><div style="font-weight:600">Total TTC</div><div class="oxa" style="font-weight:700;font-size:19px;color:var(--blue)">${fmt(f.montant)}</div></div>
  </div><div class="mf">${foot}</div>`);
}

function markSigne(ref){
  const d=DEVIS.find(x=>x.ref===ref);d.statut='signe';
  const b=document.getElementById('dbadge-'+ref);if(b)b.innerHTML=badge('signe');
  closeM();
}
function markPaid(ref,btn){
  const f=FACTURES.find(x=>x.ref===ref);f.statut='payee';f.jours=null;
  const b=document.getElementById('fbadge-'+ref);if(b)b.innerHTML=badge('payee');
  const e=document.getElementById('fech-'+ref);if(e)e.style.color='var(--soft)';
  if(btn){btn.closest('td').innerHTML='';}
  closeM();
}
function relancerD(client,btn){feedbackBtn(btn,'Envoyé ✓','ok');}
function relancerF(client,btn){feedbackBtn(btn,'Envoyé ✓','ok');}
function feedbackBtn(btn,txt,cls){
  if(!btn)return;const orig=btn.textContent,oc=btn.className;
  btn.textContent=txt;btn.className='btn sm '+cls;
  setTimeout(()=>{btn.textContent=orig;btn.className=oc;},2500);
}
function creerFact(ref){
  const d=DEVIS.find(x=>x.ref===ref);
  const num=Math.max(...FACTURES.map(f=>+(f.ref.replace('FA-',''))||0))+1;
  const padded='FA-0'+String(num).padStart(2,'0');
  const ht=Math.round(d.montant/1.1);
  FACTURES.unshift({ref:padded,client:d.client,ville:d.ville,prestation:d.prestation,montant:d.montant,montantHT:ht,tva:d.montant-ht,dateEmission:'22/06/2026',echeance:'22/07/2026',statut:'en attente',devisRef:d.ref,jours:null});
  closeM();
  go('devis');
  setTimeout(()=>{swTab(document.querySelectorAll('.tab')[1],'t-fact');},50);
}

/* ── RELANCES ── */
VIEWS.relances=function(){
  const dorms=DEVIS.filter(d=>d.statut==='dormant');
  const ages=[10,8,15,12,20,6,5,18,22,26,32,14];
  const retards=FACTURES.filter(f=>f.statut==='en retard');
  const tot=dorms.reduce((a,d)=>a+d.montant,0)+retards.reduce((a,f)=>a+f.montant,0);
  return `
<div class="ph"><h2>Relances</h2><p>Dossiers en attente d'action</p></div>
<div class="alert" style="margin-bottom:20px">
  <div><div style="font-size:11px;font-weight:600;color:var(--red);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px">Total à récupérer</div><div class="alert-val">${fmt(tot)}</div></div>
  <div class="alert-txt">${dorms.length} devis + ${retards.length} factures en attente</div>
  <button class="btn dang" onclick="lancerTout()">Tout relancer (${dorms.length+retards.length})</button>
</div>
<div class="card" style="margin-bottom:14px">
  <div class="card-title">Devis sans réponse · ${dorms.length} dossiers</div>
  ${dorms.length?`<table class="tbl"><thead><tr><th>Réf.</th><th>Client</th><th>Montant</th><th>Depuis</th><th></th></tr></thead><tbody>
  ${dorms.map((d,i)=>`<tr><td><span class="oxa" style="color:var(--blue);font-weight:600">${d.ref}</span></td><td>${d.client}<div class="sub">${d.prestation}</div></td><td><span class="oxa">${fmt(d.montant)}</span></td><td style="color:var(--amber)">${ages[i]||7} j</td><td><button class="btn sm" onclick="relancerD('${d.client}',this)">Relancer</button></td></tr>`).join('')}
  </tbody></table>`:'<p style="color:var(--soft);font-size:13.5px">Aucun devis sans réponse.</p>'}
</div>
<div class="card" style="margin-bottom:14px">
  <div class="card-title">Factures impayées · ${retards.length} dossiers</div>
  ${retards.length?`<table class="tbl"><thead><tr><th>Réf.</th><th>Client</th><th>Montant</th><th>Retard</th><th></th></tr></thead><tbody>
  ${retards.map(f=>`<tr><td><span class="oxa" style="color:var(--blue);font-weight:600">${f.ref}</span></td><td>${f.client}</td><td><span class="oxa">${fmt(f.montant)}</span></td><td style="color:var(--red)">+${f.jours} j</td><td style="display:flex;gap:8px"><button class="btn sm dang" onclick="relancerF('${f.client}',this)">Relancer</button><button class="btn sm ok" onclick="markPaid('${f.ref}',this)">Payée</button></td></tr>`).join('')}
  </tbody></table>`:'<p style="color:var(--soft);font-size:13.5px">Aucune facture impayée.</p>'}
</div>
<div class="grid2">
  <div class="card"><div class="card-title">Séquence devis</div>
    <div style="display:flex;flex-direction:column;gap:0">
      ${[['J+2','SMS de courtoisie','Confirmer réception','blue'],['J+5','Email de relance','Rappel + disponibilité','blue'],['J+10','Appel téléphonique','Proposition visite','mute']].map(([d,a,n,c])=>`<div class="seqstep"><div class="oxa" style="font-size:11px;color:var(--${c==='mute'?'soft':'blue'});font-weight:700;width:36px;flex-shrink:0">${d}</div><div><div style="font-weight:500;font-size:13.5px">${a}</div><div style="font-size:12px;color:var(--soft)">${n}</div></div></div>`).join('')}
    </div>
  </div>
  <div class="card"><div class="card-title">Séquence factures</div>
    <div style="display:flex;flex-direction:column;gap:0">
      ${[['J+3','SMS de rappel','Rappel échéance','amber'],['J+8','Email formel','Mise en demeure douce','red'],['J+15','Courrier recommandé','Procédure recouvrement','red']].map(([d,a,n,c])=>`<div class="seqstep"><div class="oxa" style="font-size:11px;color:var(--${c});font-weight:700;width:36px;flex-shrink:0">${d}</div><div><div style="font-weight:500;font-size:13.5px">${a}</div><div style="font-size:12px;color:var(--soft)">${n}</div></div></div>`).join('')}
    </div>
  </div>
</div>`;
};
function lancerTout(){document.querySelectorAll('#content button.btn.sm:not(.ok):not(.dang)').forEach(b=>feedbackBtn(b,'Envoyé ✓','ok'));}

/* ── CHANTIERS ── */
const CTYPE_COLOR={sdb:'var(--green)',clim:'var(--blue)',chauf:'var(--amber)',plomb:'var(--soft)'};
VIEWS.chantiers=function(){
  return `
<div class="ph"><h2>Chantiers</h2><p>Suivi en temps réel de vos interventions</p></div>
<div id="ch-list">${renderChList()}</div>
<div id="ch-fiche" style="display:none"></div>`;
};
function renderChList(){
  return `<div class="card" style="padding:0;overflow:hidden"><table class="tbl">
  <thead><tr><th>Client</th><th>Prestation</th><th>Avancement</th><th>Dates</th><th>Statut</th></tr></thead>
  <tbody>${CHANTIERS.map(c=>{
    const done=Object.values(c.checklist).filter(Boolean).length;
    return `<tr class="click" onclick="openCh(${c.id})">
      <td><div style="font-weight:600">${c.client}</div><div class="sub">${c.adresse} · ${c.ville}</div></td>
      <td style="color:var(--soft)">${c.prestation}</td>
      <td style="min-width:140px"><div style="display:flex;align-items:center;gap:10px"><div class="prog" style="flex:1"><span style="width:${c.avancement}%;background:${CTYPE_COLOR[c.type]}"></span></div><span class="oxa" style="font-size:13px;font-weight:600;color:${CTYPE_COLOR[c.type]};width:32px">${c.avancement}%</span></div><div style="font-size:11px;color:var(--mute);margin-top:3px">${done}/5 étapes</div></td>
      <td style="color:var(--soft);font-size:13px">${c.debut} → ${c.fin}</td>
      <td>${badge(c.statut)}</td>
    </tr>`;}).join('')}
  </tbody></table></div>`;
}
function openCh(id){
  const c=CHANTIERS.find(x=>x.id===id);
  document.getElementById('ch-list').style.display='none';
  const f=document.getElementById('ch-fiche');f.style.display='block';
  f.innerHTML=`
<button class="back-btn" onclick="backCh()">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
  Retour aux chantiers
</button>
<div class="card" style="margin-bottom:14px">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px">
    <div><div style="font-size:20px;font-weight:700;font-family:'Oxanium';margin-bottom:4px">${c.client}</div><div style="font-size:13px;color:var(--soft)">${c.adresse} · ${c.ville} · ${c.prestation}</div></div>
    ${badge(c.statut)}
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="prog" style="flex:1"><span id="ch-prog-${c.id}" style="width:${c.avancement}%;background:${CTYPE_COLOR[c.type]}"></span></div>
    <span id="ch-pct-${c.id}" class="oxa" style="font-size:16px;font-weight:700;color:${CTYPE_COLOR[c.type]}">${c.avancement} %</span>
  </div>
</div>
<div class="grid2" style="margin-bottom:14px">
  <div class="card"><div class="card-title">Étapes</div><div id="chk-${id}">${renderChk(c)}</div></div>
  <div class="card"><div class="card-title">Informations</div>
    <div class="info-row"><span class="info-lbl">Contact</span><span class="info-val">${c.contactSurPlace||'—'}</span></div>
    <div class="info-row"><span class="info-lbl">Code d'accès</span><span class="info-val">${c.codeAcces||'—'}</span></div>
    <div class="info-row"><span class="info-lbl">Début</span><span class="info-val">${c.debut}</span></div>
    <div class="info-row"><span class="info-lbl">Fin prévue</span><span class="info-val">${c.fin}</span></div>
  </div>
</div>
<div class="card">
  <div class="card-title">Journal de chantier</div>
  <div id="journal-${id}">${renderJournal(c)}</div>
  <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
    <input class="sinp" id="jinp-${id}" placeholder="Nouvelle entrée..." style="flex:1;min-width:200px">
    <label class="btn" style="cursor:pointer" title="Ajouter une photo">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      Photo
      <input type="file" id="jphoto-${id}" accept="image/*" style="display:none" onchange="previewJPhoto(${id})">
    </label>
    <button class="btn prim" onclick="addJournal(${id})">Ajouter</button>
  </div>
  <div id="jphoto-preview-${id}" style="margin-top:8px"></div>
</div>
${c.note?`<div class="card mt"><div class="card-title">Note</div><div style="font-size:13.5px;color:var(--soft)">${c.note}</div></div>`:''}`;
}
function renderChk(c){return Object.keys(c.checklist).map(k=>`<div class="chk ${c.checklist[k]?'done':''}" onclick="togChk(${c.id},'${k}')"><div class="chk-box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div><span class="chk-lbl">${CHK_LABELS[k]}</span></div>`).join('');}
function renderJournal(c){
  if(!c.journal.length)return '<div style="color:var(--soft);font-size:13.5px">Aucune entrée.</div>';
  return c.journal.map(j=>`<div class="jentry">
    <div class="jd">${j.date}</div>
    <div class="jt" style="flex:1">
      <div>${j.texte}</div>
      ${j.photo?`<img src="${j.photo}" style="margin-top:8px;max-width:100%;max-height:180px;border-radius:7px;border:1px solid var(--bor);object-fit:cover;cursor:pointer" onclick="openPhotoModal('${j.photo}')" alt="photo chantier">`:'' }
    </div>
  </div>`).join('');
}
function openPhotoModal(src){openM(`<div class="mh"><div class="oxa" style="font-weight:700">Photo chantier</div><button class="mx" onclick="closeM()">×</button></div><div class="mb" style="text-align:center"><img src="${src}" style="max-width:100%;max-height:70vh;border-radius:8px;object-fit:contain"></div>`);}
function togChk(id,key){
  const c=CHANTIERS.find(x=>x.id===id);
  c.checklist[key]=!c.checklist[key];
  const done=Object.values(c.checklist).filter(Boolean).length;
  const total=Object.keys(c.checklist).length;
  c.avancement=Math.round((done/total)*100);
  document.getElementById('chk-'+id).innerHTML=renderChk(c);
  const pb=document.getElementById('ch-prog-'+id);if(pb)pb.style.width=c.avancement+'%';
  const pt=document.getElementById('ch-pct-'+id);if(pt)pt.textContent=c.avancement+' %';
}
let _jPhotoData={};
function previewJPhoto(id){
  const fi=document.getElementById('jphoto-'+id);
  if(!fi.files[0])return;
  const r=new FileReader();
  r.onload=e=>{
    _jPhotoData[id]=e.target.result;
    document.getElementById('jphoto-preview-'+id).innerHTML=`<img src="${e.target.result}" style="height:60px;border-radius:6px;border:1px solid var(--bor);object-fit:cover"> <span style="font-size:12px;color:var(--green)">Photo prête</span>`;
  };
  r.readAsDataURL(fi.files[0]);
}
function addJournal(id){
  const c=CHANTIERS.find(x=>x.id===id);const inp=document.getElementById('jinp-'+id);
  if(!inp.value.trim()&&!_jPhotoData[id])return;
  const d=new Date();

function calNav(dir){if(dir===0){calWeekOff=0;}else{calWeekOff+=dir;}renderCal();}
function renderCal(){const el=document.getElementById('cal-body');if(el)el.innerHTML=calMode==='week'?renderCalWeek():renderCalMonth();}

function renderCalWeek(){
  const base=new Date('2026-06-22');base.setDate(base.getDate()+calWeekOff*7);
  const days=Array.from({length:7},(_,i)=>{const d=new Date(base);d.setDate(d.getDate()+i);return d;});
  const HOURS=['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];
  const todayIso='2026-06-22';
  let html=`<div style="display:grid;grid-template-columns:52px repeat(7,1fr);border:1px solid var(--bor);border-radius:var(--r);overflow:hidden;overflow-x:auto">`;
  html+=`<div style="border-bottom:1px solid var(--bor);background:rgba(255,255,255,.02)"></div>`;
  html+=days.map(d=>{
    const iso=d.toISOString().slice(0,10);
    const isToday=iso===todayIso;
    const evCnt=EVENTS.filter(e=>e.date===iso).length;
    return `<div style="text-align:center;padding:8px 4px;border-bottom:1px solid var(--bor);border-left:1px solid var(--bor);background:${isToday?'var(--blueBg)':'rgba(255,255,255,.02)'}">
      <div style="font-size:11px;color:var(--soft)">${DAY_NAMES[(d.getDay()+6)%7]}</div>
      <div class="oxa" style="font-size:18px;font-weight:700;color:${isToday?'var(--blue)':'inherit'}">${d.getDate()}</div>
      ${evCnt?`<div style="font-size:10px;color:var(--blue)">${evCnt} interv.</div>`:''}
    </div>`;
  }).join('');
  HOURS.forEach(h=>{
    html+=`<div style="font-size:10px;color:var(--mute);font-family:'Oxanium';text-align:right;padding:4px 6px 4px 2px;border-bottom:1px solid var(--bor);border-right:1px solid var(--bor);padding-top:8px">${h}</div>`;
    days.forEach(d=>{
      const iso=d.toISOString().slice(0,10);
      const evs=EVENTS.filter(e=>e.date===iso&&e.debut===h);
      const isToday=iso===todayIso;
      html+=`<div style="border-left:1px solid var(--bor);border-bottom:1px solid var(--bor);min-height:48px;padding:3px;${isToday?'background:rgba(56,189,248,.03)':''}">
        ${evs.map(e=>`<div class="cal-ev ev-${e.type}" style="cursor:pointer" onclick="openEventModal(${e.id})"><div style="font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.titre}</div><div style="font-size:10px;opacity:.75">${e.debut}–${e.fin}</div></div>`).join('')}
      </div>`;
    });
  });
  html+=`</div>`;
  return html;
}

function renderCalMonth(){
  const year=2026,month=5;
  const firstDow=new Date(year,month,1).getDay();
  const startOff=firstDow===0?6:firstDow-1;
  const daysInMonth=30;const todayDay=22;
  let html=`<div style="display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--bor);border-radius:var(--r);overflow:hidden">`;
  html+=DAY_NAMES.map(d=>`<div style="text-align:center;padding:8px 4px;font-size:11px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--bor);background:rgba(255,255,255,.02)">${d}</div>`).join('');
  for(let i=0;i<startOff;i++)html+=`<div style="border-bottom:1px solid var(--bor);border-right:1px solid var(--bor);min-height:80px;background:rgba(0,0,0,.15)"></div>`;
  for(let day=1;day<=daysInMonth;day++){
    const iso=`2026-06-${String(day).padStart(2,'0')}`;
    const evs=EVENTS.filter(e=>e.date===iso);
    const col=(startOff+day-1)%7;const isWE=col>=5;const isToday=day===todayDay;
    html+=`<div style="min-height:80px;padding:6px;border-bottom:1px solid var(--bor);${col<6?'border-right:1px solid var(--bor);':''}${isWE?'background:rgba(0,0,0,.12);':''}cursor:pointer" onclick="openDayEvents('${iso}')">
      <div style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;margin-bottom:4px;font-size:12px;font-family:'Oxanium';font-weight:600;${isToday?'background:var(--blue);color:#0a1a26':'color:var(--soft)'}">${day}</div>
      ${evs.slice(0,2).map(e=>`<div class="cal-ev ev-${e.type}" style="font-size:10px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer" onclick="event.stopPropagation();openEventModal(${e.id})">${e.titre}</div>`).join('')}
      ${evs.length>2?`<div style="font-size:10px;color:var(--soft)">+${evs.length-2} autres</div>`:''}
    </div>`;
  }
  html+=`</div>`;return html;
}

function saveEvent(){

${c.tags.length?`<div class="card mt">${c.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div>`:''}`;

/* ── DEVIS VOCAL ── */
let voiceRecog=null;
function openVoiceDevis(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const supported=!!SR;
  openM(`<div class="mh">
    <div><div class="oxa" style="font-weight:700;font-size:17px">Assistant vocal — Nouveau devis</div>
    <div style="color:var(--soft);font-size:13px;margin-top:3px">${supported?'Dictez les informations, je remplis le formulaire.':'Votre navigateur ne supporte pas la reconnaissance vocale. Remplissez manuellement.'}</div></div>
    <button class="mx" onclick="stopVoice();closeM()">×</button></div>
  <div class="mb">
    <div class="frow"><label class="flbl">Client</label><input class="finp" id="vd-client" placeholder="Nom du client"></div>
    <div class="frow"><label class="flbl">Prestation</label><input class="finp" id="vd-presta" placeholder="Ex: Climatisation split, Rénovation SDB..."></div>
    <div class="frow"><div class="grid2">
      <div><label class="flbl">Montant TTC (€)</label><input class="finp" type="number" id="vd-montant" placeholder="0"></div>
      <div><label class="flbl">Ville</label><input class="finp" id="vd-ville" placeholder="Perpignan..."></div>
    </div></div>
    ${supported?`
    <div id="voice-status" style="display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--bor);border-radius:8px;margin-top:4px;background:var(--bg)">
      <button id="voice-btn" class="btn prim" onclick="toggleVoice()" style="flex-shrink:0">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        Parler
      </button>
      <div id="voice-txt" style="font-size:13px;color:var(--soft)">Cliquez sur Parler puis dictez — ex: <em>"Client Dupont, climatisation, 3 200 euros, Perpignan"</em></div>
    </div>`:''}
  </div>
  <div class="mf">
    <button class="btn" onclick="stopVoice();closeM()">Annuler</button>
    <button class="btn prim" onclick="saveVoiceDevis()">Créer le devis</button>
  </div>`);
}

let _voiceActive=false;
function toggleVoice(){
  if(_voiceActive){stopVoice();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  voiceRecog=new SR();voiceRecog.lang='fr-FR';voiceRecog.interimResults=true;voiceRecog.maxAlternatives=1;
  const btn=document.getElementById('voice-btn');
  const txt=document.getElementById('voice-txt');
  btn.textContent='⏹ Stop';btn.classList.add('dang');btn.classList.remove('prim');
  txt.textContent='En écoute...';txt.style.color='var(--red)';
  _voiceActive=true;
  voiceRecog.onresult=e=>{
    const t=Array.from(e.results).map(r=>r[0].transcript).join(' ');
    txt.textContent='Transcription : '+t;
    if(e.results[0].isFinal){parseVoiceInput(t);stopVoice();}
  };
  voiceRecog.onerror=()=>{txt.textContent='Erreur micro. Vérifiez les permissions.';txt.style.color='var(--red)';stopVoice();};
  voiceRecog.onend=()=>{if(_voiceActive)stopVoice();};
  voiceRecog.start();
}
function stopVoice(){
  _voiceActive=false;
  if(voiceRecog){try{voiceRecog.stop();}catch(e){}}
  const btn=document.getElementById('voice-btn');
  if(btn){btn.innerHTML=\`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> Parler\`;btn.classList.remove('dang');btn.classList.add('prim');}
}
function parseVoiceInput(t){
  t=t.toLowerCase();
  // extract client: after "client" keyword
  const cl=t.match(/client\s+([\w\s\-]+?)(?:\s*,|\s+climatisation|\s+plomberie|\s+sdb|\s+rénovation|\s+chauffe|$)/);
  if(cl){const inp=document.getElementById('vd-client');if(inp)inp.value=cl[1].trim().replace(/\b\w/g,c=>c.toUpperCase());}
  // extract montant: number followed by euro
  const amt=t.match(/(\d[\d\s]*)(?:euros?|€)/);
  if(amt){const inp=document.getElementById('vd-montant');if(inp)inp.value=amt[1].replace(/\s/g,'');}
  // extract prestation
  const pmap={climatisation:'Climatisation split',clim:'Climatisation split',sdb:'Rénovation SDB','salle de bain':'Rénovation SDB','chauffe-eau':'Chauffe-eau thermodynamique',chauffe:'Chauffe-eau thermodynamique',plomberie:'Dépannage plomberie'};
  for(const [k,v] of Object.entries(pmap)){if(t.includes(k)){const inp=document.getElementById('vd-presta');if(inp)inp.value=v;break;}}
  // extract ville
  const villes=['perpignan','canet','pia','rivesaltes','saint-estève','le soler'];
  for(const v of villes){if(t.includes(v)){const inp=document.getElementById('vd-ville');if(inp)inp.value=v.replace(/\b\w/g,c=>c.toUpperCase());break;}}
  const txt=document.getElementById('voice-txt');
  if(txt){txt.textContent='Formulaire rempli — vérifiez et cliquez Créer.';txt.style.color='var(--green)';}
}
function saveVoiceDevis(){
  const client=document.getElementById('vd-client')?.value.trim();
  const presta=document.getElementById('vd-presta')?.value.trim();
  const montant=parseFloat(document.getElementById('vd-montant')?.value)||0;
  const ville=document.getElementById('vd-ville')?.value.trim()||'Perpignan';
  if(!client||!presta){alert('Client et prestation requis.');return;}
  const num=Math.max(...DEVIS.map(d=>+(d.ref.replace('DV-',''))||0))+1;
  const ref='DV-'+String(num).padStart(3,'0');
  const today=new Date();const dd=String(today.getDate()).padStart(2,'0'),mm=String(today.getMonth()+1).padStart(2,'0'),yy=today.getFullYear();
  DEVIS.unshift({ref,client,ville,prestation:presta,montant,dateEnvoi:`${dd}/${mm}/${yy}`,statut:'dormant',lignes:[{desc:presta,qte:1,unit:'ff',pu:montant,total:montant}]});
  stopVoice();closeM();go('devis');
}
